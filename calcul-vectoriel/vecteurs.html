* { box-sizing: border-box; }
:root {
  --ink: #1B2A4A; --ink2: #4A5570; --ink3: #8B8F95; --line: #D3D2C9;
  --paper: #F4F3EE; --card: #FFFFFF;
  --ok: #1E7B4F; --ok-bg: #E8F4EC; --ko: #B4233C; --ko-bg: #FBECEE;
  --shadow: 0 1px 2px rgba(27,42,74,.06), 0 6px 18px rgba(27,42,74,.07);
  --shadow-lg: 0 2px 4px rgba(27,42,74,.06), 0 16px 40px rgba(27,42,74,.14);
  --ui: "Archivo", system-ui, sans-serif;
  --accent: #007C74; --bg: #EAF5F3;
}
html { scroll-behavior: smooth; }
body {
  margin: 0; font-family: "Source Serif 4", Georgia, serif; color: var(--ink);
  /* Fond « cahier » : quadrillage fin sur blanc */
  background-color: #fff;
  background-image: linear-gradient(#ECEBE4 1px, transparent 1px), linear-gradient(90deg, #ECEBE4 1px, transparent 1px);
  background-size: 22px 22px;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 3px; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(255,255,255,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(27,42,74,.08);
}
.topbar-inner { max-width: 1320px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 13px; min-width: 0; }
.brand img { height: 44px; width: auto; flex-shrink: 0; }
.brand h1 { font: 700 17px/1.2 var(--ui); margin: 0; letter-spacing: -.1px; }
.brand p { font: 400 11.5px/1.3 var(--ui); color: var(--ink2); margin: 3px 0 0; }
.tabs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.tab {
  --c: #1B2A4A;
  display: flex; align-items: center; gap: 7px; border: 1.5px solid transparent;
  background: #ECEBE5; color: var(--ink2); border-radius: 999px; padding: 6px 13px 6px 10px;
  font: 600 12.5px var(--ui); white-space: nowrap; cursor: pointer;
  transition: background .25s, color .25s, border-color .25s, box-shadow .25s;
}
.tab .n { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
.tab.current .n { background: #fff; }
.tab:hover { border-color: var(--c); color: var(--c); background: #fff; }
.tab.current { background: var(--c); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 40%, transparent); }
.progress { height: 3px; background: linear-gradient(90deg, #007C74, #A00058 30%, #EC6708 55%, #3B5C76 78%, #8A6D1D); }

/* ---------- workspace ---------- */
.workspace {
  max-width: 1320px; margin: 0 auto; padding: 22px 24px 40px;
  display: grid; grid-template-columns: minmax(330px, 410px) minmax(0, 1fr); gap: 22px; align-items: start;
}
.node { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
.panel { padding: 20px 22px 22px; border-top: 4px solid var(--accent); position: relative; overflow: hidden; }
.panel .num { position: absolute; right: 10px; top: 6px; font: 700 72px/1 var(--ui); color: var(--accent); opacity: .09; letter-spacing: -3px; pointer-events: none; }
.tag { font: 700 10.5px var(--ui); color: var(--accent); text-transform: uppercase; letter-spacing: .9px; }
.panel h2 { font: 700 21px/1.22 var(--ui); margin: 0; letter-spacing: -.1px; }

.levels { display: flex; gap: 6px; margin: 16px 0 0; }
.lvl {
  flex: 1; border: 1.5px solid var(--line); background: #fff; color: var(--ink2); border-radius: 10px;
  padding: 7px 6px 6px; cursor: pointer; font: 600 12px/1.2 var(--ui); text-align: center;
  transition: background .2s, border-color .2s, color .2s;
}
.lvl .dots { display: block; letter-spacing: 2px; font-size: 9px; color: var(--accent); margin-bottom: 2px; }
.lvl small { display: block; font-weight: 400; font-size: 10.5px; color: var(--ink3); margin-top: 2px; }
.lvl:hover { border-color: var(--accent); }
.lvl.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.lvl.on .dots, .lvl.on small { color: #fff; }

.consigne { margin: 16px 0 0; font-size: 15px; line-height: 1.5; }
.consigne .warn {
  display: block; margin-top: 8px; padding: 8px 11px; border-radius: 8px; font-size: 14px;
  background: var(--bg); border-left: 4px solid var(--accent);
}
.question {
  margin: 16px 0 0; padding: 16px 14px; border-radius: 12px; background: var(--bg);
  border: 1.5px solid color-mix(in srgb, var(--accent) 25%, transparent);
  font-size: 23px; line-height: 1.6; text-align: center; min-height: 72px;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 8px;
}
.question .qhint { flex-basis: 100%; font: 400 12.5px var(--ui); color: var(--ink2); }
.ans {
  width: 86px; padding: 4px 6px; border: 2px dashed var(--accent); border-radius: 8px; background: #fff;
  color: var(--ink); font: 600 21px var(--ui); text-align: center; transition: border-color .2s, background .2s;
}
.ans.vec-in { width: 70px; text-transform: uppercase; letter-spacing: 1px; }
.ans:focus { outline: none; border-style: solid; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 18%, transparent); }
.ans.good { border: 2px solid var(--ok); background: var(--ok-bg); }
.ans.bad { border: 2px solid var(--ko); background: var(--ko-bg); }
.ans-wrap { display: inline-flex; flex-direction: column; align-items: center; }
.ans-wrap .arrow-over { width: 64px; height: 9px; color: var(--accent); margin-bottom: 1px; }
.slot {
  display: inline-block; min-width: 70px; padding: 3px 10px; border-radius: 8px; border: 2px dashed var(--accent);
  background: #fff; font: 600 15px/1.4 var(--ui); color: var(--ink3);
}
.slot.filled { border-style: solid; color: var(--accent); }

.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn {
  font: 700 13.5px var(--ui); border-radius: 10px; padding: 10px 12px; cursor: pointer;
  border: 1.5px solid var(--line); background: #fff; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: transform .15s, box-shadow .15s, background .2s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(1px); }
.btn.primary { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 15px; padding: 12px; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn.next { grid-column: 1 / -1; }
.btn.pulse { background: var(--accent); border-color: var(--accent); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 45%, transparent); } 50% { box-shadow: 0 0 0 7px transparent; } }
.btn[disabled] { opacity: .45; pointer-events: none; }

.fb { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14.5px; line-height: 1.5; display: none; }
.fb.show { display: block; animation: reveal .4s cubic-bezier(.2,.9,.3,1.15); }
.fb.ok { background: var(--ok-bg); border-left: 4px solid var(--ok); }
.fb.ko { background: var(--ko-bg); border-left: 4px solid var(--ko); }
.fb.hint { background: #FFF8E6; border-left: 4px solid #D9A21B; }
.fb.sol { background: var(--bg); border-left: 4px solid var(--accent); }
.fb b.t { font-family: var(--ui); display: block; margin-bottom: 3px; }
.fb .step { margin: 4px 0 0; }
@keyframes reveal { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.score { margin-top: 14px; font: 400 12px var(--ui); color: var(--ink3); text-align: center; }
.score b { color: var(--accent); }

.figure-card { padding: 10px; position: sticky; top: 84px; }
.figure-card svg { display: block; width: 100%; height: auto; max-height: calc(100vh - 215px); touch-action: none; user-select: none; -webkit-user-select: none; }
.fig-tip { font: 400 12.5px/1.4 var(--ui); color: var(--ink2); text-align: center; margin: 4px 0 2px; }
.fig-tools { display: flex; gap: 8px; justify-content: center; margin: 2px 0 6px; flex-wrap: wrap; }
.fig-tools:empty { display: none; }
.figure-card:has(.stepbar) svg { max-height: calc(100vh - 300px); }
.stepbar { width: 100%; background: var(--bg); border: 1.5px solid color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 12px; padding: 10px 14px; }
.stepbar .say { font-size: 16px; line-height: 1.55; text-align: center; min-height: 2.4em; animation: reveal .35s ease; }
.stepbar .say .sub { color: var(--ink2); font-size: .9em; }
.stepbar .nav { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.stepbar .count { font: 600 12px var(--ui); color: var(--ink2); min-width: 72px; text-align: center; }
.stepbar .btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }
.fb .calc { font-size: 16px; margin: 3px 0 0; padding: 1px 6px; border-radius: 6px; }
.fb .calc.new { background: color-mix(in srgb, var(--accent) 13%, #fff); animation: reveal .35s ease; }
.fig-tools .btn { font-size: 12.5px; padding: 7px 12px; }

/* ---------- math notation ---------- */
.vec { display: inline-block; position: relative; padding-top: .38em; line-height: 1; font-style: normal; white-space: nowrap; }
.vec::before { content: ""; position: absolute; left: .06em; right: .1em; top: .14em; border-top: .075em solid currentColor; }
.vec::after {
  content: ""; position: absolute; right: .08em; top: .14em; width: .26em; height: .26em;
  border-top: .075em solid currentColor; border-right: .075em solid currentColor;
  transform: translate(0, -50%) rotate(45deg); transform-origin: center;
}
.vec.zero::before { left: .02em; right: .02em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .8em; line-height: 1.05; margin: 0 .12em; }
.fr > span:first-child { border-bottom: .07em solid currentColor; padding: 0 .12em; }
.cv { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.1; padding: 0 .3em; margin: 0 .1em; position: relative; font-size: .92em; }
.cv::before, .cv::after { content: ""; position: absolute; top: 0; bottom: 0; width: .3em; border: .07em solid currentColor; }
.cv::before { left: 0; border-right: none; border-radius: .5em 0 0 .5em; }
.cv::after { right: 0; border-left: none; border-radius: 0 .5em .5em 0; }
.op { margin: 0 .1em; }

/* ---------- SVG figures ---------- */
.fig .gl { stroke: #E3E1D8; stroke-width: 1; }
.fig .gl.major { stroke: #D3D1C6; }
.fig .lat { fill: #C9C6BA; }
.fig .shape { fill: color-mix(in srgb, var(--accent) 6%, transparent); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; }
.fig .diag { stroke: var(--ink); stroke-width: 1.2; opacity: .55; }
.fig .pt circle.d { fill: var(--ink); }
.fig .pt text { font: 700 15px var(--ui); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.fig .pt .hit { fill: transparent; cursor: pointer; }
.fig .pt.clickable:hover circle.d { fill: var(--accent); }
.fig .pt.flash circle.d { fill: var(--accent); }
.fig .pt.user circle.d { fill: var(--accent); }
.fig .pt.user text { fill: var(--accent); }
.fig .pt.sol circle.d { fill: var(--ok); }
.fig .pt.extra circle.d { fill: var(--accent); }
.fig .pt.extra text { fill: var(--accent); }
.fig .pt.sol text { fill: var(--ok); }
.fig .arr line { stroke: var(--c, var(--ink)); stroke-linecap: round; }
.fig .arr path { fill: var(--c, var(--ink)); }
.fig .arr.ghost { opacity: .4; }
.fig .arr.ghost line { stroke-dasharray: 6 5; }
.fig .arr.user { --c: var(--accent); }
.fig .arr.res { --c: #C2410C; }
.fig .lbl { font: 700 14px var(--ui); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.fig .cnt { font: 600 11px var(--ui); fill: var(--ink2); text-anchor: middle; }
.fig .cursor-dot { fill: var(--accent); opacity: .25; pointer-events: none; }
.fig .origin-pulse { fill: none; stroke: var(--accent); stroke-width: 2; animation: opulse 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes opulse { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(1.8); } }
.fig .fade-in { animation: fadeIn .4s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.fig text.cap { font: 600 12px var(--ui); fill: var(--ink2); }
.fig .piece { cursor: grab; }
.fig .piece:active { cursor: grabbing; }
.fig .piece .hitline { stroke: transparent; stroke-width: 20; stroke-linecap: round; pointer-events: stroke; }
.fig .piece.sel .arr { filter: drop-shadow(0 0 3px rgba(27,42,74,.55)); }
.fig .piece.sel .arr line { stroke-width: 4.2; }
.fig .piece .lbl { pointer-events: none; }
.fig .arr.reject { --c: var(--ko); animation: fadeOut .9s ease forwards; }
@keyframes fadeOut { 0%, 50% { opacity: 1; } 100% { opacity: 0; } }
.fig .join { fill: none; stroke: var(--ok); stroke-width: 3; animation: opulse .65s ease-out 2; transform-box: fill-box; transform-origin: center; }
.fig-tools .btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.fig-tools .sep { width: 1px; background: var(--line); margin: 2px 4px; }

@media (max-width: 960px) {
  .workspace { grid-template-columns: 1fr; padding: 16px; }
  .figure-card { position: relative; top: 0; }
  .topbar-inner { flex-wrap: wrap; padding: 10px 16px; }
  .tabs { margin-left: 0; justify-content: flex-start; }
}
@media (max-width: 560px) {
  .brand img { height: 34px; }
  .tab { font-size: 11.5px; padding: 5px 10px 5px 8px; }
  .question { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>

<script>
'use strict';
/* =====================================================================
   Outils généraux : hasard, fractions, notation, SVG, animations
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const MINUS = '−';
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
const sub = (p, q) => [p[0] - q[0], p[1] - q[1]];
const scl = (k, p) => [k * p[0], k * p[1]];
const same = (p, q) => Math.abs(p[0] - q[0]) < 1e-9 && Math.abs(p[1] - q[1]) < 1e-9;
const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];

/* ---------- fractions {n, d} ---------- */
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
function F(n, d = 1) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return { n: n / g, d: d / g }; }
const fmul = (a, b) => F(a.n * b.n, a.d * b.d);
const fdiv = (a, b) => F(a.n * b.d, a.d * b.n);
const feq = (a, b) => a.n === b.n && a.d === b.d;
const fval = a => a.n / a.d;
const fneg = a => F(-a.n, a.d);

// Lit « -2/3 », « −2/3 », « 0,5 », « 1.5 », « 3 »
function parseNum(str) {
  str = String(str).replace(/\s+/g, '').replace(/[−–]/g, '-').replace(/,/g, '.');
  const m = str.match(/^([+-]?)(\d+(?:\.\d+)?|\.\d+)(?:\/([+-]?)(\d+(?:\.\d+)?))?$/);
  if (!m) return null;
  const dec = s => { const p = s.split('.'); const k = p[1] ? p[1].length : 0; return F(parseInt(p[0] || '0', 10) * 10 ** k + (k ? parseInt(p[1], 10) : 0), 10 ** k); };
  let f = dec(m[2]);
  if (m[4] !== undefined) { const d = dec(m[4]); if (d.n === 0) return null; f = fdiv(f, d); }
  if ((m[1] === '-') !== (m[3] === '-')) f = fneg(f);
  return f;
}

/* ---------- notation HTML ---------- */
const numStr = n => (n < 0 ? MINUS : '') + Math.abs(n);
const signed = n => (n > 0 ? '+' : n < 0 ? MINUS : '') + Math.abs(n);
function fracHTML(f, dec) {
  if (f.d === 1) return numStr(f.n);
  if (dec) { const v = Math.round(f.n / f.d * 1000) / 1000; return (v < 0 ? MINUS : '') + String(Math.abs(v)).replace('.', ','); }
  return (f.n < 0 ? MINUS : '') + `<span class="fr"><span>${Math.abs(f.n)}</span><span>${f.d}</span></span>`;
}
const fracTxt = f => f.d === 1 ? numStr(f.n) : numStr(f.n) + '/' + f.d;
const paren = (f, dec) => fval(f) < 0 ? `(${fracHTML(f, dec)})` : fracHTML(f, dec);
const vec = name => `<span class="vec">${name}</span>`;
const zeroVec = () => `<span class="vec zero">0</span>`;
// coefficient devant un vecteur : 1 → rien, −1 → «−»
function coefHTML(k, dec) {

function makeGrid(svg, cols, rows, cell = 32, pad = 26) {

  for (let j = 0; j <= rows; j++) svgEl('line', { class: 'gl', x1: pad, y1: pad + j * cell, x2: pad + cols * cell, y2: pad + j * cell }, g);

    const x = Math.max(0, Math.min(cols, Math.round((X - pad) / cell)));

function compExplain(P, terms, dec) {

  const mid = terms.map((t, i) => {

function showStep(i) {

  i = Math.max(0, Math.min(n - 1, i));
  sol.i = i;
  $('figTools').innerHTML = `<div class="stepbar"><div class="say">${sol.steps[i].say}</div><div class="nav">`

    + `<span class="count">Étape ${i + 1} / ${n}</span>`
    + `<button class="btn" id="sAgain">↻ Rejouer</button>`
    + `<button class="btn go" id="sNext"${i < n - 1 ? '' : ' disabled'}>${i < n - 1 ? 'Étape suivante ▶' : 'Terminé ✓'}</button></div></div>`;
  $('sPrev').onclick = () => showStep(i - 1);
  $('sAgain').onclick = () => showStep(i);

    const S = sol.reset();
    animScale = 0;                           // les étapes déjà vues sont rejouées instantanément
    try { for (let j = 0; j < i; j++) await sol.steps[j].run(S); } finally { animScale = 1; }

}
function boot() {
  $('bCheck').onclick = doCheck;
  $('bHint').onclick = doHint;
  $('bSolve').onclick = doSolve;
  $('bNext').onclick = () => newQuestion(true);
  $('bNew').onclick = () => newQuestion(false);

    if (!App.sol || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    const j = App.sol.i + (e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0);
    if (j !== App.sol.i && j >= 0 && j < App.sol.steps.length) showStep(j);

  const h = new URLSearchParams(location.hash.slice(1));

}

/* =====================================================================

const FRAC_GLYPH = { '1/2': '½', '1/3': '⅓', '2/3': '⅔', '1/4': '¼', '3/4': '¾' };

  return (l.n < 0 ? MINUS : '') + (FRAC_GLYPH[a] || (l.d > 1 ? a + ' ' : a));

  const vs = [];
  let idx = 0;
  parts.forEach(p => {
    const s = svgEl('tspan', {}, t), txt = p[0] === '@' ? p.slice(1) : p;
    s.textContent = txt;
    if (p[0] === '@') vs.push([idx, txt.length]);
    idx += txt.length;
  });
  try {
    vs.forEach(([i, n]) => {
      const x0 = t.getStartPositionOfChar(i).x, w = t.getSubStringLength(i, n);
      arrow(parent, [x0 + 1, xy[1] - 13], [x0 + w - 1, xy[1] - 13], { color, w: 1.3 });

    let best = null, bs = Infinity;
    terms.forEach((t, i) => {

      if (d[0] * v[1] - d[1] * v[0] !== 0) return;
      const lam = v[0] !== 0 ? F(d[0], v[0]) : F(d[1], v[1]);
      if (![F(1), F(-1), t.k, fneg(t.k), F(1, t.k.d), F(-1, t.k.d)].some(x => feq(x, lam))) return;
      const score = (same(at, originOf(t)) ? 0 : 10) + pieces.filter(p => p.term === t).length;
      if (score < bs) { bs = score; best = { term: t, lam, color: CHAIN_COLORS[i % 4] }; }

/* o : svg, layer, toPx(m), snap(px) → node, mode() → 'build'|'result'|'point',

      let n = [-(Q[1] - P[1]) / L, (Q[0] - P[0]) / L];

    redraw() { pieces.forEach(render); if (result) render(result); },

}

// Barre d'outils sous la figure : modes + opposé / supprimer / tout effacer

function boardTools(ctx, ui, board, modes) {
  ctx.tools.innerHTML = '';

    const b = document.createElement('button');
    b.className = 'btn'; b.innerHTML = html; b.title = title; b.onclick = fn;
    ctx.tools.appendChild(b); return b;
  };
  const mb = {};
  if (modes && modes.length > 1) modes.forEach(([m, label]) => {
    mb[m] = btn(label, '', () => { ui.mode = m; refresh(); });
  });
  const bFlip = btn('↺ Opposé', 'Retourner le vecteur sélectionné', () => board.flip());
  const bDel = btn('🗑 Supprimer', 'Supprimer le vecteur sélectionné', () => board.remove());
  btn('✕ Tout effacer', 'Effacer tous tes vecteurs', () => { board.reset(); ctx.changed(); });

    for (const m in mb) mb[m].classList.toggle('on', ui.mode === m);
    const s = board.selected;

    if (ui.onMode) ui.onMode(ui.mode);

    if (!zero && terms.some(t => same(scl(fval(t.k), latVal(env, t.a, t.b)), r))) continue;   // un terme serait déjà le résultat
    const items = latItems(env, terms);
    if (o.fits && !items.every(it => o.fits(it.from) && o.fits(add(it.from, it.d)))) continue;
    const chain = bestChain(env, items, o.fits);

function latParse(env, s) {
  s = s.trim().toUpperCase().replace(/\s/g, '');
  if (s === '0' || s === 'O') return { d: [0, 0], name: '0' };
  if (s.length !== 2 || !env.letters.includes(s[0]) || !env.letters.includes(s[1])) return null;
  return { d: latVal(env, s[0], s[1]), name: s };
}
function latResultHTML(q) {
  if (q.zero) return `le vecteur nul ${zeroVec()}`;
  if (q.names.length) return vec(q.names[0]) + orList(q.names.slice(1, 6));
  return '<b style="color:#C2410C">le vecteur orange</b>';
}
function latCheck(q, d, name) {
  if (same(d, q.r)) {
    if (q.zero) return { ok: true, msg: `C’est le vecteur nul ${zeroVec()} : les vecteurs se compensent.` };
    const others = q.names.filter(n => n !== name);
    return { ok: true, msg: (name ? `${vec(name)} convient.` : 'Ton vecteur est égal au résultat.') + (others.length ? ` Autres réponses possibles : ${others.slice(0, 6).map(vec).join(', ')}.` : '') };
  }
  if (q.zero) return { msg: 'Pas encore. Regarde bien : les vecteurs ne se compensent-ils pas ?' };
  if (same(d, scl(-1, q.r))) return { msg: 'Bonne direction et bonne longueur, mais pas le bon <b>sens</b> !' };
  return { msg: 'Pas encore. Relation de Chasles : remplace un vecteur par un vecteur <b>égal</b> qui commence là où l’autre se termine.' };
}
function latGhosts(env, terms) {
  clear(env.L.ghost);
  terms.forEach((t, i) => arrow(env.L.ghost, env.px(env.lat[t.a]), env.px(env.lat[t.b]), { color: CHAIN_COLORS[i % 4], cls: 'ghost', w: 2.6 }));
}
function latHint(env, q) {
  play(async () => latGhosts(env, q.terms));
  const tips = [];
  q.terms.forEach(t => {
    const c = coefHTML(F(Math.abs(t.k.n)));
    if (t.k.n < 0) tips.push(`Soustraire, c’est additionner l’opposé : ${MINUS}${c}${vec(t.a + t.b)} = ${c}${vec(t.b + t.a)}. Tu peux le tracer directement dans l’autre sens.`);
    else if (t.k.n === 2) tips.push(`2${vec(t.a + t.b)} : un vecteur deux fois plus long que ${vec(t.a + t.b)}, dans le même sens.`);
  });
  // premier déplacement utile de la construction « idéale »
  let cur = q.chain.start, swap = null;
  for (const it of q.chain.order) {
    const end = add(cur, it.d), p = latNameAt(env, cur), e = latNameAt(env, end);
    if (!swap && !same(it.from, cur) && p && e) swap = [itemName(it), vec(p + e)];
    cur = end;
  }
  if (swap) tips.push(`Astuce : ${swap[0]} = ${swap[1]} (vecteurs égaux). Remplace-le pour que les vecteurs se suivent, puis applique la relation de Chasles.`);
  else tips.push('Les vecteurs peuvent déjà se suivre : applique la relation de Chasles.');
  if (q.chain.reordered) tips.push('Tu peux changer l’ordre des vecteurs dans une somme.');

}
// Correction pas à pas : dessiner chaque vecteur, déplacer ceux qui ne se suivent pas, Chasles en une fois
// fill(réponse) est appelé à la dernière étape
function latSteps(env, q, fill) {
  const L = env.L, px = m => env.px(m), nm = m => latNameAt(env, m), steps = [];
  const items = q.chain.order, byTerm = items.slice().sort((x, y) => x.i - y.i);
  // écriture courante, une entrée par terme de l'énoncé
  const cur = q.terms.map(t => ({ k: t.k, a: t.a, b: t.b }));
  let ordered = false;
  const line = () => '= ' + termsHTML(ordered ? items.map(it => cur[it.i]) : cur);
  const drawIt = async (S, it, ms) => {
    const P0 = px(it.from);
    S.arr[it.i] = arrow(L.main, P0, P0, { color: it.col, w: 3 });
    await grow(S.arr[it.i], P0, px(add(it.from, it.d)), ms);
  };
  // aide temporaire : le vecteur de l'énoncé en pointillés, effacé une fois le vrai vecteur tracé
  const ghostTerm = it => {
    const t = q.terms[it.i], box = svgEl('g', {}, L.ghost);
    arrow(box, px(env.lat[t.a]), px(env.lat[t.b]), { color: it.col, cls: 'ghost', w: 2.4 });
    return box;
  };

  // 1. dessiner les vecteurs « simples », puis un par un ceux qui demandent une explication
  const simple = byTerm.filter(it => q.terms[it.i].k.n === 1), special = byTerm.filter(it => q.terms[it.i].k.n !== 1);
  steps.push({
    say: `On veut calculer ${termsHTML(q.terms)}.` + (simple.length ? ` On dessine ${simple.map(it => vec(it.a + it.b)).join(' et ')}.` : ''),
    write: termsHTML(q.terms),
    run: async S => { for (const it of simple) await drawIt(S, it, 800); if (!simple.length) await wait(300); }
  });
  special.forEach(it => {
    const t = q.terms[it.i], ab = vec(t.a + t.b), ba = vec(t.b + t.a);
    let say;
    if (t.k.n === -1) say = `${MINUS}${ab} = ${ba} : soustraire, c’est additionner l’opposé. On trace directement ${ba}, c’est-à-dire ${ab} dans l’autre sens.`;
    else if (t.k.n === 2) say = `2${ab} : on trace un vecteur deux fois plus long que ${ab}, dans le même sens.`;
    else say = `${MINUS}2${ab} = 2${ba} : on trace un vecteur deux fois plus long que ${ab}, dans l’autre sens.`;
    const changed = t.k.n < 0;
    if (changed) cur[it.i] = { k: F(it.k), a: it.a, b: it.b };
    steps.push({ say, write: changed ? line() : null, run: async S => { const box = ghostTerm(it); await wait(500); await drawIt(S, it, 1100); await fadeOut(box); } });
  });
  // 2. ranger les vecteurs dans l'ordre de la construction
  if (q.chain.reordered) {
    ordered = true;
    steps.push({ say: 'Dans une somme, on peut changer l’ordre des vecteurs : on les range pour qu’ils puissent se suivre.', write: line(), run: () => wait(600) });
  }
  ordered = true;
  // 3. déplacer seulement les vecteurs qui ne se suivent pas encore
  let pt = q.chain.start;
  items.forEach((it, j) => {
    if (!same(it.from, pt)) {
      const na = nm(pt), nb = nm(add(pt, it.d)), old = itemName(it), target = pt;
      let say;
      if (na && nb) {
        say = j === 0 ? `On remplace ${old} par le vecteur égal ${vec(na + nb)}.`
          : `On remplace ${old} par le vecteur égal ${vec(na + nb)}, qui commence en ${na} : ainsi les vecteurs se suivent.`;
        cur[it.i] = { k: F(1), a: na, b: nb };
      } else say = `On fait glisser ${old} pour qu’il commence au bout du vecteur précédent : c’est un vecteur égal.`;
      steps.push({
        say, write: na && nb ? line() : null,
        run: async S => {
          const a = S.arr[it.i], box = svgEl('g', {}, L.ghost);
          arrow(box, a.p, a.q, { color: it.col, cls: 'ghost', w: 2.4 });
          await wait(300);
          await slide(a, px(target), 1500);
          await fadeOut(box);
        }
      });
    }
    pt = add(pt, it.d);
  });
  // 4. relation de Chasles, en une fois
  const S0 = q.chain.start, end = pt, sn = nm(S0), en = nm(end);
  const chainHTML = termsHTML(items.map(it => cur[it.i]));
  const named = sn && en;
  let say, write = null;
  if (q.zero) { say = `${chainHTML} = ${vec(sn + sn)} : on revient au point de départ, c’est le vecteur nul.`; write = `= ${zeroVec()}`; }
  else if (named) { say = `Les vecteurs se suivent : ${chainHTML} = ${vec(sn + en)} (relation de Chasles).`; write = `= ${vec(sn + en)}`; }
  else say = 'Les vecteurs se suivent. Relation de Chasles : le résultat va de l’origine du premier vecteur à l’extrémité du dernier.';
  steps.push({
    say, write,
    run: async S => {
      Object.values(S.arr).forEach(a => { a.g.style.opacity = .25; });
      if (q.zero) { const c = px(S0); svgEl('circle', { class: 'join', cx: c[0], cy: c[1], r: 12 }, L.top); await wait(800); return; }
      S.res = arrow(L.top, px(S0), px(S0), { cls: 'res', w: 3.8 });
      await grow(S.res, px(S0), px(end), 1100);
    }
  });
  // 5. réponse
  const resName = !q.zero && sn && en ? sn + en : null;
  const others = resName ? q.names.filter(n => n !== resName).slice(0, 5) : [];
  const answer = q.zero ? '0' : (resName || q.names[0]);
  steps.push({
    say: q.zero ? `Réponse : le vecteur nul ${zeroVec()} (on tape 0).`
      : `Réponse : <b>${vec(answer)}</b>${others.length ? ` — tout vecteur égal convient aussi : ${others.map(vec).join(', ')}.` : '.'}`
        + (q.extra ? ' Le point F a été ajouté car le résultat sort du parallélogramme.' : ''),
    write: null,
    run: async S => { if (S.res) S.res.g.style.filter = 'drop-shadow(0 0 4px rgba(194,65,12,.6))'; if (fill) fill(answer); await wait(200); }
  });
  return { steps, reset: () => { clear(L.ghost, L.main, L.top); return { arr: {}, res: null }; } };
}

register({

      }

  }

   Exercice 3 (p. 5) : dessiner un représentant d'un vecteur
   ===================================================================== */
// Tire une combinaison de termes {k, a, b} selon un « gabarit » de coefficients
function drawTerms(P, names, coefs) {
  const used = new Set(), terms = [];
  for (const k of coefs) {
    let a, b, tries = 0;
    do { a = pick(names); b = pick(names); tries++; }
    while ((a === b || used.has(a + b) || used.has(b + a)) && tries < 50);
    if (tries >= 50) return null;
    used.add(a + b);
    terms.push({ k, a, b });
  }
  return terms;
}
// Le coefficient fractionnaire donne-t-il des composantes entières ?
const intComps = (P, terms) => terms.every(t => { const c = comp(P, t); return (c[0] * t.k.n) % t.k.d === 0 && (c[1] * t.k.n) % t.k.d === 0; });

// Gabarits de coefficients par niveau (communs aux exercices 3 et 5)
const INT1 = () => F(pick([2, 3, 2, 3, -1, -2]));
const SIGN = () => F(pick([1, 1, -1]));
const SMALL = () => F(pick([1, 2, 3, 1, 2, -1, -2, -3]));
const FRAC = () => pick([F(1, 2), F(-1, 2), F(1, 3), F(-1, 3), F(3, 2), F(-3, 2), F(2, 3), F(4, 3), F(-4, 3), F(1, 4), F(3, 4)]);

register({
  id: '3', page: 5, title: 'Tracer un vecteur', short: 'Tracer',
  accent: '#A00058', bg: '#F9EDF3',
  levels: [['Débutant', 'multiple ou somme simple'], ['Moyen', 'fractions, 2 vecteurs'], ['Expert', '2 ou 3 vecteurs']],
  consigne: () => `Dessine un <b>représentant</b> du vecteur demandé sur le quadrillage.`
    + `<span class="warn"><b>✏ Construis-le</b> avec des copies des vecteurs de l’énoncé mises bout à bout, puis <b>🎯 trace le résultat</b>. `
    + `Tu peux le dessiner <b>où tu veux</b> : un vecteur ne dépend pas de l’endroit où on le place, seulement de sa direction, de son sens et de sa longueur.</span>`,

  create(ctx) {
    const NAMES = ['A', 'B', 'C', 'D', 'E', 'F'], svg = ctx.svg, ui = { mode: 'build' };
    const G = makeGrid(svg, 20, 14, 30);
    const L = layers(svg, ['ghost', 'main', 'pts', 'board', 'top']);
    let P, q, refreshTools;
    const nameAt = m => NAMES.find(n => same(P[n], m)) || null;
    const board = vectorBoard({
      svg, layer: L.board, toPx: G.px, snap: G.snap, mode: () => ui.mode,
      match: (d, at, pieces) => termMatcher(q.terms, t => comp(P, t), t => P[t.a])(d, at, pieces),
      label: p => p.isResult ? ['résultat'] : termLabel(p, nameAt),
      onChange: () => ctx.changed(),
      onSelect: () => refreshTools && refreshTools(),
      onReject: () => feedback('ko', 'Ce vecteur ne sert pas dans cette construction',
        `Construis avec les vecteurs de l’énoncé (${q.terms.map(t => vec(t.a + t.b)).join(', ')}), leurs opposés ou leurs morceaux. `
        + `Pour la réponse finale, choisis « 🎯 Tracer le résultat ».`)
    });

    function newFigure() {
      P = randomPoints(NAMES, 3, 17, 2, 12, 2);
      clear(L.pts);
      NAMES.forEach(n => point(L.pts, G.px(P[n]), n));
    }

    function genQuestion() {
      const lv = ctx.level;
      for (let tries = 0; tries < 3000; tries++) {
        let coefs;
        const r = Math.random();
        if (lv === 1) coefs = r < .5 ? [INT1()] : [F(1), SIGN()];
        else if (lv === 2) coefs = r < .4 ? [FRAC()] : [SMALL(), SMALL()];
        else coefs = r < .45 ? [pick([FRAC(), SMALL()]), SMALL()].sort(() => Math.random() - .5) : [SMALL(), SIGN(), SIGN()];
        if (lv === 2 && coefs.length === 2 && coefs.every(k => Math.abs(k.n) === 1)) continue;
        if (lv === 3 && coefs.length === 2 && coefs.every(k => k.d === 1)) continue;
        const terms = drawTerms(P, NAMES, coefs);
        if (!terms || !intComps(P, terms)) continue;
        const R = combo(P, terms);
        if (!R[0] && !R[1]) continue;
        if (Math.abs(R[0]) > 17 || Math.abs(R[1]) > 11) continue;
        // la construction pas à pas doit tenir dans le quadrillage
        const o = chainOffsets(P, terms), xs = o.map(d => d[0]), ys = o.map(d => d[1]);
        if (Math.max(...xs) - Math.min(...xs) > G.cols || Math.max(...ys) - Math.min(...ys) > G.rows) continue;
        if (!drawJoinPlan(G, P, terms).ok) continue;   // la correction part de la première lettre
        return { terms, R };
      }
    }

    function render() {
      ctx.q.innerHTML = `<span>${termsHTML(q.terms)}</span><span class="qhint">Construis ce vecteur, puis trace le <b>résultat</b> sur le quadrillage.</span>`;
      ctx.tip.innerHTML = '<b>✏ Construire</b> : trace des copies des vecteurs de l’énoncé et fais-les glisser bout à bout. '
        + '<b>🎯 Résultat</b> : trace ta réponse finale. Clique une flèche pour la sélectionner (opposé, supprimer).';
      refreshTools = boardTools(ctx, ui, board, [['build', '✏ Construire'], ['result', '🎯 Tracer le résultat']]);
    }

    return {
      debug: () => ({ q, board, P, G }),
      next(sameFigure) {
        cancelAnim();
        clear(L.ghost, L.main, L.top);
        if (!sameFigure || !P) newFigure();
        board.reset(); board.enabled = true; ui.mode = 'build';
        q = genQuestion(); render();
      },
      check() {
        const v = board.result;
        if (!v) return { empty: true, msg: 'Choisis « 🎯 Tracer le résultat » et trace ta réponse sur le quadrillage.' };
        const d = v.d, R = q.R;
        if (same(d, R)) return { ok: true, msg: `Ton vecteur a pour composantes ${cv(R[0], R[1])}, exactement comme ${termsHTML(q.terms)}.` };
        if (same(d, scl(-1, R))) return { msg: 'Bonne direction et bonne longueur… mais pas le bon <b>sens</b> !' };
        const cross = d[0] * R[1] - d[1] * R[0], dot = d[0] * R[0] + d[1] * R[1];
        if (cross === 0 && dot > 0) return { msg: 'Bonne direction et bon sens, mais pas la bonne <b>longueur</b>.' };
        if (cross === 0) return { msg: 'Bonne direction, mais ni le bon sens ni la bonne longueur.' };
        return { msg: 'Ton vecteur n’a pas la bonne <b>direction</b>. Construis-le bout à bout, ou utilise l’indice.' };
      },
      hint() {
        play(async () => {
          clear(L.ghost);
          q.terms.forEach((t, i) => arrow(L.ghost, G.px(P[t.a]), G.px(P[t.b]), { color: CHAIN_COLORS[i % 4], cls: 'ghost', w: 2.4 }));
        });
        const tips = [];
        q.terms.forEach(t => {
          const name = vec(t.a + t.b), a = Math.abs(t.k.n);
          if (t.k.d !== 1) tips.push(`Pour ${fracHTML(F(a, t.k.d))} ${name}, partage ${name} en ${t.k.d} parts égales et prends-en ${a}.`);
          else if (a > 1) tips.push(`${fracHTML(F(a))} ${name} : un vecteur ${a} fois plus long que ${name}.`);
          if (t.k.n < 0) tips.push(`Le signe ${MINUS} devant ${name} change le <b>sens</b> : ${MINUS}${name} = ${vec(t.b + t.a)}. Tu peux le tracer directement dans l’autre sens.`);
        });
        if (q.terms.length > 1) tips.push('Ensuite, fais glisser les vecteurs <b>bout à bout</b> (relation de Chasles) : le résultat va de l’origine du premier à l’extrémité du dernier.');
        return tips.map(t => `<p class="step">• ${t}</p>`).join('') + '<p class="step">Les vecteurs de l’énoncé sont repassés en pointillés sur la figure.</p>';
      },
      solve() {
        const ex = compExplain(P, q.terms);
        return {
          reset: () => { clear(L.ghost, L.main, L.top); board.enabled = false; board.fade(true); return { arr: {} }; },
          steps: gridDrawJoin(G, L, P, q.terms, {
            endSay: `Les vecteurs se suivent : le résultat va de l’origine du premier à l’extrémité du dernier (relation de Chasles), soit ${moveWords(q.R)}.`,
            endWrite: ex.line
          })
        };
      }
    };
  }
});

/* =====================================================================
   Exercice 5 (p. 6) : situer un point défini par une égalité vectorielle
   ===================================================================== */
register({
  id: '5', page: 6, title: 'Placer un point', short: 'Placer',
  accent: '#EC6708', bg: '#FDF1E7',
  levels: [['Débutant', 'un vecteur ou une somme'], ['Moyen', 'fractions, multiples'], ['Expert', 'point à l’origine']],
  consigne: lv => `Place le point demandé sur le quadrillage pour que l’égalité soit vraie.`
    + `<span class="warn"><b>✏ Construis</b> le vecteur en partant du point connu (copies des vecteurs de l’énoncé mises bout à bout), puis <b>📍 place le point</b>.`
    + (lv === 3 ? ' Attention : le point cherché est parfois l’<b>origine</b> du vecteur !' : '') + `</span>`,

  create(ctx) {
    const NAMES = ['A', 'B', 'C', 'D', 'E'], NEW = ['F', 'G', 'H', 'I', 'J'];
    const svg = ctx.svg, ui = { mode: 'build' };
    const G = makeGrid(svg, 20, 14, 30);
    const L = layers(svg, ['ghost', 'main', 'pts', 'board', 'user', 'top']);
    let P, q, user = null, count = 0, refreshTools;
    const nameAt = m => NAMES.find(n => same(P[n], m)) || null;
    const board = vectorBoard({
      svg, layer: L.board, toPx: G.px, snap: G.snap, mode: () => ui.mode,
      match: (d, at, pieces) => termMatcher(q.terms, t => comp(P, t), t => P[t.a])(d, at, pieces),
      label: p => termLabel(p, nameAt),
      onPoint: n => { if (!App.solved) place(n.m); },
      onChange: () => ctx.changed(),
      onSelect: () => refreshTools && refreshTools(),
      onReject: () => feedback('ko', 'Ce vecteur ne sert pas dans cette construction',
        `Construis avec les vecteurs de l’énoncé (${q.terms.map(t => vec(t.a + t.b)).join(', ')}), leurs opposés ou leurs morceaux.`)
    });

    function newFigure() {
      P = randomPoints(NAMES, 4, 16, 3, 11, 3);
      clear(L.pts);
      NAMES.forEach(n => point(L.pts, G.px(P[n]), n));
    }

    function place(m) {
      if (user) user.g.remove();
      user = { m, g: point(L.user, G.px(m), q.N, { cls: 'user', r: 6 }) };
      ctx.changed();
    }

    function genQuestion() {
      const lv = ctx.level;
      for (let tries = 0; tries < 3000; tries++) {
        let coefs, origin = false;
        const r = Math.random();
        if (lv === 1) coefs = r < .3 ? [F(1)] : r < .65 ? [INT1()] : [F(1), SIGN()];
        else if (lv === 2) coefs = r < .45 ? [FRAC()] : [SMALL(), SMALL()];
        else { origin = Math.random() < .7; coefs = r < .35 ? [FRAC()] : r < .75 ? [SMALL(), SIGN()] : [SIGN(), SIGN(), SIGN()]; }
        if (lv === 2 && coefs.length === 2 && coefs.every(k => Math.abs(k.n) === 1)) continue;
        const X = pick(NAMES), terms = drawTerms(P, NAMES, coefs);
        if (!terms) continue;
        if (terms.length === 1 && Math.random() < .5 && terms[0].b !== X) terms[0].a = X;   // ex. BF = −½ BE
        if (!intComps(P, terms)) continue;
        const R = combo(P, terms);
        if (!R[0] && !R[1]) continue;
        const sgn = origin ? -1 : 1, target = add(P[X], scl(sgn, R));
        if (!G.inside(target) || NAMES.some(n => same(P[n], target))) continue;
        const steps = terms.map(t => ({ ...t, k: origin ? fneg(t.k) : t.k }));
        if (!chainOffsets(P, steps).every(d => G.inside(add(P[X], d)))) continue;
        return { X, N: NEW[count++ % NEW.length], terms, steps, R, origin, target };
      }
    }

    function render() {
      const lhs = q.origin ? q.N + q.X : q.X + q.N;
      ctx.q.innerHTML = `<span>${vec(lhs)} <span class="op">=</span> ${termsHTML(q.terms)}</span><span class="qhint">Place le point <b>${q.N}</b> sur le quadrillage.</span>`;
      ctx.tip.innerHTML = `<b>✏ Construire</b> : trace des copies des vecteurs et fais-les glisser bout à bout. `
        + `<b>📍 Placer ${q.N}</b> : clique sur un nœud (clique ailleurs pour le déplacer).`;
      refreshTools = boardTools(ctx, ui, board, [['build', '✏ Construire'], ['point', `📍 Placer ${q.N}`]]);
    }

    return {
      debug: () => ({ q, board, P, G }),
      next(sameFigure) {
        cancelAnim();
        clear(L.ghost, L.main, L.top);
        if (!sameFigure || !P) newFigure();
        if (user) { user.g.remove(); user = null; }
        board.reset(); board.enabled = true; ui.mode = 'build';
        q = genQuestion(); render();
      },
      check() {
        if (!user) return { empty: true, msg: `Place d’abord le point ${q.N} sur le quadrillage.` };
        if (same(user.m, q.target)) return { ok: true, msg: `${q.N} est bien placé : depuis ${q.X}, on se déplace de ${moveWords(sub(q.target, P[q.X]))}.` };
        const wrongWay = add(P[q.X], scl(q.origin ? 1 : -1, q.R));
        if (same(user.m, wrongWay)) return {
          msg: q.origin
            ? `Attention : dans ${vec(q.N + q.X)}, c’est ${q.N} l’<b>origine</b> et ${q.X} l’extrémité. Tu as fait l’inverse !`
            : 'Bonne longueur, mais tu es parti dans le mauvais <b>sens</b>.'
        };
        return { msg: `Pas encore. Pars de ${q.X} et construis ${termsHTML(q.terms)} étape par étape.` };
      },
      hint() {
        play(async () => {
          clear(L.ghost);
          q.terms.forEach((t, i) => arrow(L.ghost, G.px(P[t.a]), G.px(P[t.b]), { color: CHAIN_COLORS[i % 4], cls: 'ghost', w: 2.4 }));
        });
        const tips = [];
        if (q.origin) tips.push(`${vec(q.N + q.X)} = … veut dire : en partant de ${q.N} et en suivant ce vecteur, on arrive en ${q.X}. Donc pour trouver ${q.N}, pars de <b>${q.X}</b> et suis le vecteur <b>opposé</b>.`);
        else tips.push(`Pars du point <b>${q.X}</b> : ${q.N} est l’extrémité du vecteur.`);
        q.terms.forEach(t => {
          const name = vec(t.a + t.b), a = Math.abs(t.k.n);
          if (t.k.d !== 1) tips.push(`${fracHTML(F(a, t.k.d))} ${name} : partage ${name} en ${t.k.d} parts égales et prends-en ${a}.`);
          else if (a > 1) tips.push(`${a} ${name} : reporte ${name} ${a} fois bout à bout.`);
        });
        if (q.terms.length > 1) tips.push('Place les vecteurs bout à bout (Chasles).');
        return tips.map(t => `<p class="step">• ${t}</p>`).join('');
      },
      solve() {
        const ex = compExplain(P, q.steps), d = sub(q.target, P[q.X]);
        return {
          reset: () => {
            clear(L.ghost, L.main, L.top);
            if (user) user.g.style.opacity = .35;
            board.enabled = false; board.fade(true);
            return {};
          },
          steps: gridSteps(G, L, P, q.steps, P[q.X], {
            intro: q.origin
              ? `${vec(q.N + q.X)} = … veut dire : en partant de ${q.N}, on arrive en ${q.X}. Donc on part de <b>${q.X}</b> avec les vecteurs <b>opposés</b> pour retrouver ${q.N}.`
              : `${q.N} est l’extrémité du vecteur : on part du point <b>${q.X}</b> et on met les vecteurs bout à bout.`,
            introWrite: q.origin
              ? `${vec(q.N + q.X)} = ${termsHTML(q.terms)} &nbsp;⟺&nbsp; ${vec(q.X + q.N)} = ${termsHTML(q.steps)}`
              : `${vec(q.X + q.N)} = ${termsHTML(q.terms)}`,
            endSay: `On arrive au point <b>${q.N}</b> : depuis ${q.X}, ${moveWords(d)}.`,
            endWrite: ex.line,
            onEnd: () => point(L.top, G.px(q.target), q.N, { cls: 'sol fade-in', r: 6.5 })
          })
        };
      }
    };
  }
});

/* =====================================================================
   Exercice 6 (p. 6) : parallélogramme ABDC, diagonales sécantes en E
   ===================================================================== */
register({
  id: '6', page: 6, title: 'Parallélogramme', short: 'Parallélogramme',
  accent: '#3B5C76', bg: '#EEF1F4',
  levels: [['Débutant', 'somme de 2 vecteurs'], ['Moyen', 'avec soustraction'], ['Expert', 'le résultat peut sortir']],
  consigne: () => `<b>ABDC</b> est un parallélogramme dont les diagonales se coupent en <b>E</b>. Calcule la somme.`
    + `<span class="warn"><b>Construis</b> les vecteurs sur la figure et fais-les <b>glisser</b> bout à bout.<br>`
    + `⚠ Le résultat peut <b>sortir du parallélogramme</b> ! Dans ce cas, un point <b>F</b> est ajouté sur la figure pour que tu puisses l’écrire avec des lettres. `
    + `Tape deux lettres (ou 0 pour le vecteur nul), ou choisis « 🎯 Tracer le résultat ». Tout vecteur égal au résultat est accepté.</span>`,

  create(ctx) {
    // coordonnées « réseau » en demi-côtés : A(0;0) B(2;0) C(0;2) D(2;2) E(1;1)
    const lat = { A: [0, 0], B: [2, 0], C: [0, 2], D: [2, 2], E: [1, 1] };
    const MARGIN = 170, RANGE = 10;
    const svg = ctx.svg, ui = { mode: 'build' };
    let env, q, board, refreshTools, b, c, O, W, H;
    const px = p => [O[0] + p[0] * b[0] / 2 + p[1] * c[0] / 2, O[1] + p[0] * b[1] / 2 + p[1] * c[1] / 2];
    const node = m => ({ key: m.join(), m, px: px(m) });
    const fits = p => { const s = px(p); return s[0] > 22 && s[0] < W - 22 && s[1] > 22 && s[1] < H - 22; };
    const L = layers(svg, ['lat', 'base', 'ghost', 'main', 'pts', 'board', 'top']);
    env = { lat, letters: ['A', 'B', 'C', 'D', 'E'], px, L };

    function newShape() {
      b = [rnd(190, 240), rnd(-22, 22)];
      c = [pick([-1, 1]) * rnd(35, 90), rnd(140, 175)];
      const xs = [0, b[0], c[0], b[0] + c[0]], ys = [0, b[1], c[1], b[1] + c[1]];
      O = [MARGIN - Math.min(...xs), MARGIN - Math.min(...ys)];
      W = Math.max(...xs) - Math.min(...xs) + 2 * MARGIN;
      H = Math.max(...ys) - Math.min(...ys) + 2 * MARGIN;
    }
    function drawFigure() {
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
      clear(L.lat, L.base, L.pts, L.ghost, L.main, L.top);
      for (let i = -RANGE; i <= RANGE; i++) for (let j = -RANGE; j <= RANGE; j++) {
        const p = px([i, j]);
        if (p[0] > 8 && p[0] < W - 8 && p[1] > 8 && p[1] < H - 8) svgEl('circle', { class: 'lat', cx: p[0], cy: p[1], r: 2.2 }, L.lat);
      }
      svgEl('polygon', { class: 'shape', points: ['A', 'B', 'D', 'C'].map(l => px(lat[l]).join(',')).join(' ') }, L.base);
      [['A', 'D'], ['B', 'C']].forEach(([u, v]) => {
        const p = px(lat[u]), r = px(lat[v]);
        svgEl('line', { class: 'diag', x1: p[0], y1: p[1], x2: r[0], y2: r[1] }, L.base);
      });
      const centre = px([1, 1]);
      env.letters.forEach(l => {
        const P = px(lat[l]);
        let off = [0, -18];
        if (l !== 'E') { const d = sub(P, centre), n = Math.hypot(d[0], d[1]); off = [d[0] / n * 22, d[1] / n * 22]; }
        point(L.pts, P, l, { off, anchor: 'middle', cls: l === 'F' ? 'extra' : '' });
      });
      board.redraw();
    }

    board = vectorBoard({
      svg, layer: L.board, toPx: px, mode: () => ui.mode,
      snap: pt => node(skewSnap(pt, px, O, [b[0] / 2, b[1] / 2], [c[0] / 2, c[1] / 2])),
      match: (d, at, pieces) => termMatcher(q.terms, t => latVal(env, t.a, t.b), t => lat[t.a])(d, at, pieces),
      label: p => termLabel(p, m => latNameAt(env, m)),
      onChange: () => {
        // résultat tracé entre deux points nommés → ses lettres s'écrivent dans la case
        const r = board.result, i = ctx.q.querySelector('.ans');
        if (r && i) { const a = latNameAt(env, r.at), e = latNameAt(env, add(r.at, r.d)); i.value = a && e ? a + e : ''; }
        ctx.changed();
      },
      onSelect: () => refreshTools && refreshTools(),
      onReject: () => feedback('ko', 'Ce vecteur ne fait pas partie de la somme',
        `Trace un des vecteurs de l’énoncé : ${q.terms.map(t => vec(t.a + t.b)).join(', ')} (ou leur opposé). Pour tracer le résultat, choisis d’abord « 🎯 Tracer le résultat ».`)
    });

    function options() {
      const lv = ctx.level;
      if (lv === 1) return { n: 2, real: true, fits };
      if (lv === 2) return { n: 2, minus: true, mustMinus: true, real: true, zero: true, noDirect: true, fits };
      return Math.random() < .5 ? { n: 3, minus: true, outside: true, zero: true, fits } : { n: 2, minus: true, outside: true, noDirect: true, fits };
    }

    return {
      debug: () => ({ q, board, env }),
      next(sameFigure) {
        cancelAnim();
        board.reset(); board.enabled = true; ui.mode = 'build';
        if (!sameFigure || !b) newShape();
        delete lat.F; env.letters = ['A', 'B', 'C', 'D', 'E'];
        q = genLatSum(env, options());
        if (!q.real) {
          // le résultat sort de la figure : on nomme F l'extrémité de la construction
          lat.F = add(q.chain.start, q.r);
          env.letters = env.letters.concat('F');
          q.names = latVecs(env).get(q.r.join()) || [];
          q.real = true; q.extra = true;
        }
        drawFigure();
        ctx.q.innerHTML = `<span>${termsHTML(q.terms)}</span> <span class="op">=</span> ${VEC_INPUT}`
          + `<span class="qhint">Tape deux lettres, 0, ou trace le résultat sur la figure.</span>`;
        ctx.q.querySelector('.ans').addEventListener('input', () => board.clearResult());
        refreshTools = boardTools(ctx, ui, board, [['build', '✏ Construire'], ['result', '🎯 Tracer le résultat']]);
        ctx.tip.innerHTML = 'Pour <b>tracer</b> : appuie sur un point et glisse jusqu’à l’extrémité (ou clique deux points). '
          + 'Pour <b>déplacer</b> : attrape une flèche. Clique une flèche pour la sélectionner.';
      },
      check() {
        const inp = ctx.q.querySelector('.ans'), s = inp.value.trim();
        if (s) {
          const a = latParse(env, s);
          if (!a) { inp.classList.add('bad'); return { msg: `Écris deux lettres de la figure (${env.letters.join(', ')}), 0, ou trace le résultat.` }; }
          const r = latCheck(q, a.d, a.name === '0' ? null : a.name);
          inp.classList.add(r.ok ? 'good' : 'bad');
          return r;
        }
        const res = board.result;
        if (!res) return { empty: true, msg: 'Tape le résultat dans la case, ou choisis « 🎯 Tracer le résultat » et trace-le sur la figure.' };
        return latCheck(q, res.d, null);
      },
      hint() { return latHint(env, q); },
      solve() {
        const inp = ctx.q.querySelector('.ans');
        const sol = latSteps(env, q, v => { inp.value = v; inp.classList.remove('bad'); inp.classList.add('good'); });
        return { steps: sol.steps, reset: () => { board.enabled = false; board.fade(true); return sol.reset(); } };
      }
    };
  }
});

/* =====================================================================
   Exercice 7 (p. 6) : vecteurs sur une droite graduée
   ===================================================================== */
register({
  id: '7', page: 6, title: 'Droite graduée', short: 'Droite graduée',
  accent: '#8A6D1D', bg: '#FBF6EA',
  newLabel: lv => lv === 1 ? null : '⟳ Nouvelle figure',   // niveau 1 : toujours la même droite
  levels: [['Entiers', 'nombres entiers'], ['Fractions', 'fractions, décimaux'], ['Expert', 'lettres mélangées']],
  consigne: lv => `Les points sont placés sur une droite graduée. Complète l’égalité avec le <b>nombre</b> ou le <b>vecteur</b> qui manque.`
    + `<span class="warn">Compte les graduations de chaque vecteur : vers la droite c’est <b>+</b>, vers la gauche c’est <b>${MINUS}</b>.`
    + (lv === 3 ? ' Attention, ici les lettres ne sont pas dans l’ordre !' : '') + `</span>`,

  create(ctx) {
    const svg = ctx.svg, W = 760, H = 240, Y0 = 128, TOP = Y0 - 62, BOT = Y0 + 58;
    const LET = ['A', 'B', 'C', 'D', 'E', 'F'];
    const C_KNOWN = '#3B5C76', C_ANS = '#C2410C';
    let pos = {}, T = 7, q = null, refreshTools;
    const val = (a, b) => pos[b] - pos[a];
    const X = i => 50 + i * (660 / T);
    // « couloirs » où l'élève peut tracer : la droite (0), deux au-dessus, un en dessous
    const LANES = [-1, 0, 1, 2], laneY = j => Y0 - j * 46;
    const ui = { mode: 'build' };
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const L = layers(svg, ['base', 'ghost', 'main', 'pts', 'board']);
    const node = m => ({ key: m.join(), m, px: [X(m[0]), laneY(m[1])] });
    const letterAt = i => LET.find(l => pos[l] === i) || null;
    const nameOn = (at, d) => {
      if (at[1] !== 0) return null;
      const a = letterAt(at[0]), b = letterAt(at[0] + d[0]);
      return a && b ? a + b : null;
    };
    const board = vectorBoard({
      svg, layer: L.board, mode: () => ui.mode,
      toPx: m => [X(m[0]), laneY(m[1])],
      snap: ([x, y]) => {
        const i = Math.max(0, Math.min(T, Math.round((x - X(0)) / (X(1) - X(0)))));
        const j = LANES.reduce((b, j) => Math.abs(laneY(j) - y) < Math.abs(laneY(b) - y) ? j : b, 0);
        return node([i, j]);
      },
      project: (a, b) => node([b.m[0], a.m[1]]),     // vecteurs horizontaux seulement
      match: (d, at, pieces) => ({ term: null, lam: F(1), name: nameOn(at, d), color: CHAIN_COLORS[pieces.length % 4] }),
      label: p => {
        const cur = nameOn(p.at, p.d), parts = p.name ? ['@' + p.name] : [];
        if (cur && cur !== p.name) parts.push(p.name ? ' = ' : '', '@' + cur);
        parts.push((parts.length ? ' : ' : '') + signed(p.d[0]));
        return parts;
      },
      onChange: () => {},
      onSelect: () => refreshTools && refreshTools()
    });
    const allPairs = () => LET.flatMap(a => LET.filter(b => b !== a).map(b => a + b));
    const withVal = v => allPairs().filter(p => val(p[0], p[1]) === v);
    const grad = n => `<b>${signed(n)}</b> graduation${Math.abs(n) > 1 ? 's' : ''}`;

    function newFigure() {
      const lv = ctx.level;
      if (lv === 1) { T = 7; LET.forEach((l, i) => pos[l] = i + 1); }
      else if (lv === 2) {
        T = 10;
        do { let p = rnd(0, 1); LET.forEach(l => { pos[l] = p; p += rnd(1, 2); }); } while (pos.F > 10);
      } else {
        T = 10;
        const ps = shuffle([...Array(11).keys()]).slice(0, 6);
        LET.forEach((l, i) => pos[l] = ps[i]);
      }
      drawFigure();
    }

    function drawFigure() {
      clear(L.base, L.ghost, L.main, L.pts);
      for (let i = 0; i <= T; i++) svgEl('line', { class: 'gl', x1: X(i), y1: 18, x2: X(i), y2: H - 18, 'stroke-dasharray': '4 4' }, L.base);
      svgEl('line', { x1: 14, y1: Y0, x2: W - 14, y2: Y0, stroke: '#1B2A4A', 'stroke-width': 2 }, L.base);
      for (let i = 0; i <= T; i++) svgEl('line', { x1: X(i), y1: Y0 - 6, x2: X(i), y2: Y0 + 6, stroke: '#1B2A4A', 'stroke-width': 1.6 }, L.base);
      for (const j of LANES) if (j) svgEl('line', { x1: X(0), y1: laneY(j), x2: X(T), y2: laneY(j), stroke: '#E3E1D8', 'stroke-width': 1 }, L.base);
      LET.forEach(l => point(L.pts, [X(pos[l]), Y0], l, { r: 5, off: [0, -20], anchor: 'middle' }));
    }

    function genQuestion() {
      const lv = ctx.level, P = allPairs();
      const types = lv === 1 ? ['K', 'K', 'K', 'V'] : lv === 2 ? ['K', 'K', 'V', 'D'] : ['K', 'V', 'D'];
      const decs = [F(1, 2), F(-1, 2), F(3, 2), F(-3, 2), F(1, 5), F(-1, 5), F(2, 5), F(1, 4), F(5, 2), F(-5, 2), F(3, 4), F(-2, 5)];
      for (let tries = 0; tries < 2000; tries++) {
        const t = pick(types), u = pick(P);
        if (t === 'D') {
          const k = pick(decs), r = fmul(F(val(u[0], u[1])), k);
          if (r.d !== 1 || r.n === 0 || !withVal(r.n).length) continue;
          if (fval(k) < 0 && Math.random() < .5) continue;
          return { t, u, k, target: r.n };
        }
        const v = pick(P);
        if (u === v) continue;
        const k = F(val(u[0], u[1]), val(v[0], v[1]));
        if (k.d > 6 || Math.abs(k.n) > 9) continue;
        if (lv === 1 && (k.d !== 1 || Math.abs(k.n) > 6)) continue;
        if (lv === 1 && t === 'V' && Math.abs(k.n) === 1) continue;
        if (lv >= 2 && k.d === 1 && Math.random() < .75) continue;
        if (feq(k, F(1)) && Math.random() < .8) continue;
        if (fval(k) < 0 && Math.random() < .65) continue;     // pas trop de négatifs
        return { t, u, v, k, target: val(v[0], v[1]) };
      }
    }

    function render() {
      const dec = q.t === 'D';
      if (q.t === 'K') ctx.q.innerHTML = `${vec(q.u)} <span class="op">=</span> ${NUM_INPUT} ${vec(q.v)}`;
      else if (q.t === 'V') ctx.q.innerHTML = `${vec(q.u)} <span class="op">=</span> ${coefHTML(q.k)} ${VEC_INPUT}`;
      else ctx.q.innerHTML = `${coefHTML(q.k, dec)} ${vec(q.u)} <span class="op">=</span> ${VEC_INPUT}`;
      ctx.q.insertAdjacentHTML('beforeend', `<span class="qhint">${q.t === 'K'
        ? 'Tape un nombre : entier, fraction (ex. −3/2), décimal (ex. 0,5) ou juste − pour −1.'
        : 'Tape deux lettres de la droite.'}</span>`);
      ctx.tip.innerHTML = '<b>Manipule</b> : trace un vecteur sur la droite (d’un point à un autre) ou dans un couloir, puis fais-le <b>glisser</b> '
        + 'pour le comparer aux autres. Par exemple : combien de fois ' + 'AB tient-il dans AD ?';
      refreshTools = boardTools(ctx, ui, board, null);
    }

    // Trace un vecteur graduation par graduation, au-dessus ou en dessous de la droite
    async function hop(name, y, color, label) {
      const a = name[0], b = name[1], n = val(a, b), s = Math.sign(n);
      for (const l of [a, b]) svgEl('line', { x1: X(pos[l]), y1: Y0, x2: X(pos[l]), y2: y, stroke: color, 'stroke-width': 1.2, 'stroke-dasharray': '3 3', opacity: .6 }, L.ghost);
      const ar = arrow(L.main, [X(pos[a]), y], [X(pos[a]), y], { color, w: 3 });
      const below = y > Y0;
      for (let i = 1; i <= Math.abs(n); i++) {
        const p0 = [X(pos[a] + s * (i - 1)), y], p1 = [X(pos[a] + s * i), y];
        await tween(480, t => ar.set([X(pos[a]), y], lerp(p0, p1, t)));
        svgText(L.main, (p0[0] + p1[0]) / 2, y + (below ? 17 : -8), i, { class: 'cnt fade-in' });
      }
      const mid = (X(pos[a]) + X(pos[b])) / 2;
      vecLabel(L.main, [mid, y + (below ? 40 : -30)], name, color, label === false ? '' : ` : ${signed(n)}`);
      await wait(250);
    }

    function hintArrows() {
      clear(L.ghost, L.main);
      const show = (name, y, color) => {
        const a = name[0], b = name[1];
        arrow(L.main, [X(pos[a]), y], [X(pos[b]), y], { color, w: 3 });
        vecLabel(L.main, [(X(pos[a]) + X(pos[b])) / 2, y - 30], name, color);
      };
      show(q.u, TOP, C_KNOWN);
      if (q.t === 'K') show(q.v, BOT + 0, C_ANS);
    }

    return {
      debug: () => ({ q, board, pos }),
      next(sameFigure) {
        cancelAnim();
        if (!sameFigure || q === null) newFigure(); else clear(L.ghost, L.main);
        board.reset(); board.enabled = true;
        q = genQuestion(); render();
      },
      check() {
        const inp = ctx.q.querySelector('.ans'), s = inp.value.trim();
        if (!s) return { empty: true, msg: q.t === 'K' ? 'Écris un nombre dans la case.' : 'Écris un vecteur dans la case (deux lettres).' };
        const bad = msg => { inp.classList.add('bad'); return { msg }; };
        if (q.t === 'K') {
          // « − » seul vaut −1 (comme dans −AB), « + » seul vaut 1
          const f = /^[-−–]$/.test(s) ? F(-1) : s === '+' ? F(1) : parseNum(s);
          if (!f) return bad('Écris un nombre : par exemple −2, 3/4 ou 0,5.');
          if (feq(f, q.k)) { inp.classList.add('good'); return { ok: true, msg: `${vec(q.u)} = ${coefHTML(q.k) || '1 '}${vec(q.v)}` }; }
          if (feq(f, fneg(q.k))) return bad('Presque ! Regarde bien le <b>sens</b> des deux vecteurs.');
          if (f.n !== 0 && feq(f, F(q.k.d, q.k.n))) return bad(`Tu as fait le calcul à l’envers : combien de fois ${vec(q.v)} faut-il pour obtenir ${vec(q.u)} ?`);
          return bad('Compte les graduations de chaque vecteur (avec le signe), puis divise.');
        }
        const v = s.toUpperCase();
        if (!/^[A-F]{2}$/.test(v) || v[0] === v[1]) return bad('Écris un vecteur avec deux lettres différentes de la figure (par ex. <b>AB</b>).');
        const got = val(v[0], v[1]);
        if (got === q.target) {
          inp.classList.add('good');
          return { ok: true, msg: `${vec(v)} convient.` + (withVal(q.target).length > 1 ? ` Autres réponses possibles : ${withVal(q.target).filter(p => p !== v).map(vec).join(', ')}.` : '') };
        }
        if (got === -q.target) return bad(`${vec(v)} a la bonne longueur… mais pas le bon <b>sens</b> !`);
        return bad(`${vec(v)} fait ${grad(got)}. Ce n’est pas la bonne longueur.`);
      },
      hint() {
        play(async () => hintArrows());
        const vu = val(q.u[0], q.u[1]);
        if (q.t === 'K') return `Compte les graduations de ${vec(q.u)} et de ${vec(q.v)}, avec leur signe. Le nombre cherché est : <br>(graduations de ${vec(q.u)}) ÷ (graduations de ${vec(q.v)}).`;
        if (q.t === 'V') return `${vec(q.u)} fait ${grad(vu)}. Divise ce nombre par ${paren(q.k)} : tu obtiens le nombre de graduations (avec le signe) du vecteur cherché.`;
        return `${vec(q.u)} fait ${grad(vu)}. Multiplie ce nombre par ${paren(q.k, true)} : tu obtiens le nombre de graduations (avec le signe) du vecteur cherché.`;
      },
      solve() {
        const inp = ctx.q.querySelector('.ans'), vu = val(q.u[0], q.u[1]);
        const fill = v => { inp.value = v; inp.classList.remove('bad'); inp.classList.add('good'); };
        const reset = () => { clear(L.ghost, L.main); board.enabled = false; board.fade(true); return {}; };
        const countU = {
          say: `On compte les graduations de ${vec(q.u)} : vers la droite c’est <b>+</b>, vers la gauche c’est <b>${MINUS}</b>.`,
          write: `${vec(q.u)} : ${grad(vu)}`,
          run: () => hop(q.u, TOP, C_KNOWN)
        };
        if (q.t === 'K') {
          const vv = val(q.v[0], q.v[1]);
          return {
            reset, steps: [countU,
              { say: `On compte les graduations de ${vec(q.v)}.`, write: `${vec(q.v)} : ${grad(vv)}`, run: () => hop(q.v, BOT, C_ANS) },
              {
                say: `Combien de fois ${vec(q.v)} faut-il pour obtenir ${vec(q.u)} ? On divise : ${numStr(vu)} ÷ ${paren(F(vv))} = <b>${fracHTML(q.k)}</b>.`,
                write: `${vec(q.u)} = ${coefHTML(q.k) || '1 '}${vec(q.v)}`,
                run: async () => { fill(fracTxt(q.k)); await wait(300); }
              }]
          };
        }
        const answers = withVal(q.target), best = answers[0];
        const calc = q.t === 'V'
          ? `${numStr(vu)} ÷ ${paren(q.k)} = ${signed(q.target)}`
          : `${paren(q.k, true)} × ${paren(F(vu))} = ${signed(q.target)}`;
        return {
          reset, steps: [countU,
            { say: `Le vecteur cherché fait ${calc} graduations.`, write: calc, run: () => wait(400) },
            {
              say: `Sur la droite, un vecteur de ${signed(q.target)} graduations : <b>${vec(best)}</b>${orList(answers.slice(1))}.`,
              write: q.t === 'V' ? `${vec(q.u)} = ${coefHTML(q.k)}${vec(best)}` : `${coefHTML(q.k, true)}${vec(q.u)} = ${vec(best)}`,
              run: async () => { await hop(best, BOT, C_ANS); fill(best); }
            }]
        };
      }
    };
  }
});

boot();

</script>
</body>
</html>
