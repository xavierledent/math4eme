// composante connue (fraction), inconnue 'a' (Orthogonaux) ou expression p·a + q ({ p, q }, ex. a + 2, 2a − 1)
const estA = x => x === 'a' || (x && x.p !== undefined);
const aff = x => x === 'a' ? { p: F(1), q: F(0) } : estA(x) ? x : { p: F(0), q: x };
const affA = (p, q = 0) => ({ p: fr(p), q: fr(q) });
// c·a écrit « 3a », « −a », « a »
const coefA = c => (feq(c, F(1)) ? '' : feq(c, F(-1)) ? MINUS : fh(c)) + '<i>a</i>';
// « 2a − 1 », « a + 3 », « 5 » (un nombre seul si p = 0)
function affHTML(x) {
  const { p, q } = aff(x);
  if (!p.n) return fh(q);
  return coefA(p) + (q.n ? ` ${q.n < 0 ? MINUS : '+'} ${fh(F(Math.abs(q.n), q.d))}` : '');
}
const aSeul = x => { const { p, q } = aff(x); return feq(p, F(1)) && !q.n; };
const ent = x => estA(x) ? affHTML(x) : fh(x);
const entP = x => estA(x) ? (aSeul(x) ? '<i>a</i>' : `(${affHTML(x)})`) : fp(x);
const cvA = e => cvS(ent(e[0]), ent(e[1]));
const fois = (p, q) => `${entP(p)}&thinsp;·&thinsp;${entP(q)}`;
// produit de deux expressions dont une au plus contient a → expression p·a + q
function amul(x, y) {
  x = aff(x); y = aff(y);
  return { p: fadd(fmul(x.p, y.q), fmul(y.p, x.q)), q: fmul(x.q, y.q) };
}
// somme de termes { k, a } : « 3a − 2a », « 12 − 6 » (termes nuls omis)
function somme(t) {
  t = t.filter(x => x.k.n);
  if (!t.length) return '0';
  return t.map((x, i) => {
    const ab = F(Math.abs(x.k.n), x.k.d), m = x.a ? coefA(ab) : fh(ab);
    return i === 0 ? (x.k.n < 0 ? MINUS : '') + m : ` ${x.k.n < 0 ? MINUS : '+'} ${m}`;
  }).join('');
}
// valeur d'une composante pour une valeur de a
const evalA = (x, a) => estA(x) ? fadd(fmul(aff(x).p, a), aff(x).q) : x;
// équation des produits en croix xu·yv = xv·yu, ramenée à c·a = n
function equationA(e) {
  const g = amul(e[0][0], e[1][1]), d = amul(e[1][0], e[0][1]);
  return { g, d, c: fsub(g.p, d.p), n: fsub(d.q, g.q) };
}
const FRACS = [F(1, 2), F(-1, 2), F(3, 2), F(-3, 2), F(5, 2), F(1, 3), F(2, 3), F(-2, 3), F(4, 3), F(1, 4), F(3, 4), F(-3, 4)];
// « Trouver a » (Colinéaires et Orthogonaux) : u et v avec l'inconnue a dans v ;
// equation(e) ramène la condition à c·a = n
function genereA(equation) {
  // simple : a seul (40 %) ; fraction : des fractions dans l'énoncé (30 %) ;
  // decale : a + 2, a − 3… (20 %) ; double : a dans les deux composantes de v (10 %)
  // a est toujours dans v (u est dessiné dès le départ) et l'équation a toujours une seule solution
  const r = Math.random(), genre = r < .4 ? 'simple' : r < .7 ? 'fraction' : r < .9 ? 'decale' : 'double';
  for (;;) {
    let e;
    if (genre === 'double') {
      const [p1, p2] = pick([[1, 1], [1, 1], [1, 2], [2, 1]]);
      e = [vecPlein(5, 2), [affA(p1, rnd(-5, 5)), affA(p2, rnd(-5, 5))]];
      if (!e[1][0].q.n && !e[1][1].q.n) continue;
    } else {
      const x = () => genre === 'fraction' && Math.random() < .45 ? pick(FRACS) : F(nz(-6, 6));
      e = genre === 'fraction' ? [[x(), x()], [x(), x()]] : [vecPlein(6, 2), vecPlein(8, 2)];
      const j = rnd(0, 1);
      e[1][j] = affA(1, genre === 'decale' ? nz(-5, 5) : 0);
      if (genre === 'fraction' && ![...e[0], e[1][1 - j]].some(f => f.d > 1)) continue;
    }
    const { c, n } = equation(e);
    if (!c.n) continue;
    const a = fdiv(n, c), u = e[0].map(x => evalA(x, a)), v = e[1].map(x => evalA(x, a));
    if (a.d > 6 || !a.n || Math.abs(num(a)) > 15 || vnul(v) || v.some(f => Math.abs(num(f)) > 15)) continue;
    if (genre === 'simple' && fint(a) && Math.random() < .35) continue;          // quelques fractions
    return { type: 'a', genre, e, a, u, v };
  }
}
// dernière étape de la résolution : c·a = n → a (diviser, ou multiplier par l'inverse)
// gauche : la ligne précédente est déjà « c·a = n » ; finale : remplit la réponse et anime la figure
function etapeDiviser(steps, cc, nn, a, gauche, finale) {
  if (feq(cc, F(1))) {
    if (gauche) steps[steps.length - 1].run = finale;
    else steps.push({ say: 'On lit la valeur de <i>a</i>.', write: `<i>a</i> = ${fh(a)}`, run: finale });
  } else if (fint(cc)) {
    // a = n / c (sans répéter la fraction quand elle est déjà simplifiée)
    const deja = cc.n > 0 && fint(nn) && a.d === cc.n;
    steps.push({ say: `On divise par ${fh(cc)}.`, write: `<i>a</i> = ${fint(nn) ? frS(fh(nn), fh(cc)) : `${fh(nn)} : ${fp(cc)}`}${deja ? '' : ` = ${fh(a)}`}`, run: finale });
  } else {
    // coefficient fractionnaire : on multiplie par son inverse
    const inv = fdiv(F(1), cc);
    steps.push({ say: `On multiplie par l’inverse de ${fh(cc)}, c’est-à-dire par ${fh(inv)}.`, write: `<i>a</i> = ${fp(nn)}&thinsp;·&thinsp;${fp(inv)} = ${fh(a)}`, run: finale });
  }
}
// v = k·u ? renvoie k (fraction) ou null
function kDe(u, v) {
  if (det(u, v).n) return null;
  return u[0].n ? fdiv(v[0], u[0]) : fdiv(v[1], u[1]);
}
// représentants de u et v (origines Pu, Pv) qui tiennent dans le cadre de base
function placerDeux(R, u, v) {
  for (let k = 0; k < 400; k++) {
    const Pu = V(rnd(-9, 9), rnd(-6, 6)), Pv = V(rnd(-9, 9), rnd(-6, 6));
    if ([Pu, vadd(Pu, u), Pv, vadd(Pv, v)].every(p => R.inside(p, .8)) && vlen(vsub(Pu, Pv)) > 3) return [Pu, Pv];
  }
  return [V(-6, 0), V(2, 0)];
}
const degres = (u, v) => Math.acos(Math.max(-1, Math.min(1, num(scal(u, v)) / (vlen(u) * vlen(v))))) * 180 / Math.PI;

register({
  id: 'c3', title: 'Vecteurs colinéaires', short: 'Colinéaires',
  accent: '#EC6708', bg: '#FDF1E7',
  explorer: 'fais tourner v',
  levels: [['Le test', 'test de colinéarité'], ['Trouver a', 'équation à résoudre'], ['Alignés ?', 'trois points']],

  create(ctx) {
    const lv = ctx.level, R = makeRepere(ctx.svg);
    const L = layers(ctx.svg, ['aide', 'main', 'pts', 'top', 'poi']);
    let q = null, D = null, defis;

    /* ---------- mode Explorer ---------- */
    function explorer() {

        { txt: `${vec('v')} colinéaire à ${vec('u')}, avec un k qui <b>n’est pas un nombre entier</b>.`, test: () => { const x = k(); return x && x.n && !fint(x); } }

    function maj() {
      const { u, v, Pu, Pv } = D, p1 = fmul(u[0], v[1]), p2 = fmul(v[0], u[1]), k = kDe(u, v);
      let concl;

      R.fleche(L.main, Pu, vadd(Pu, u), { color: COL_U });
      if (!vnul(v)) R.fleche(L.main, Pv, vadd(Pv, v), { color: k ? COL_W : COL_V });
      R.point(L.pts, Pv, '', { r: 3.5 });
      anneau(R, L.poi, vadd(Pv, v), COL_V);
      // les noms en dernier : ils évitent les flèches

      if (!vnul(v)) R.nom(L.main, Pv, vadd(Pv, v), 'v', k ? COL_W : COL_V);

    poignees(R, {
      actif: () => lv === 0,
      liste: () => [{ m: vadd(D.Pv, D.v), bouger: m => { D.v = vsub(m, D.Pv); maj(); } }],
      clic: m => { D.v = vsub(V(...m), D.Pv); maj(); }

    /* ---------- questions ---------- */
    const KS = [F(2), F(3), F(-1), F(-2), F(1, 2), F(-1, 2), F(3, 2), F(-3, 2), F(-3), F(2, 3)];
    // vecteur v colinéaire à u (k pris dans KS, composantes entières), ou « presque » colinéaire
    function paire(colin, m = 5) {

        if (!fint(v[0]) || !fint(v[1]) || Math.abs(num(v[0])) > 9 || Math.abs(num(v[1])) > 9 || feq(k, F(1))) continue;

    }
    // même chose avec des fractions : u fractionnaire, ou u entier et k fractionnaire (v a alors des fractions)

        const v = vscl(k, u);

      if (lv === 2) {
        return genereA(equationA);
      }
      for (;;) {
        const loin = Math.random() < .6, m = loin ? 14 : 6;
        const A = V(rnd(-m, m), rnd(-m, m)), d = vecPlein(loin ? 8 : 4, 2), k = pick([F(2), F(3), F(-1), F(-2), F(3, 2), F(5, 2)]);
        const B = vadd(A, d); let C = vadd(A, vscl(k, d));
        if (!fint(C[0]) || !fint(C[1])) continue;
        if (!colin) C = vadd(C, Math.random() < .5 ? V(pick([-1, 1]), 0) : V(0, pick([-1, 1])));
        return { type: 'aligne', A, B, C, AB: vsub(B, A), AC: vsub(C, A), colin, vu: false };
      }
    }
    function poser() {
      let h;
      if (q.type === 'test') {
        h = `<span class="pts">${vec('u')} = ${cvF(q.u)} &nbsp; ${vec('v')} = ${cvF(q.v)}</span>`
          + ligneQ(`${XU}·${YV} =`, champ('p1', 'produit x u fois y v'), `&nbsp; ${XV}·${YU} =`, champ('p2', 'produit x v fois y u'))
          + ligneQ('<span class="petit">Colinéaires ?</span>', ouiNon('c', 'Colinéaires ?'))
          + `<span class="ligne k-ligne" hidden>${vec('v')} = ${champ('k', 'k')} ${vec('u')}</span>`;
      } else if (q.type === 'a') {
        h = `<span class="pts">${vec('u')} = ${cvA(q.e[0])} &nbsp; ${vec('v')} = ${cvA(q.e[1])}</span>` + ligneQ('<i>a</i> =', champ('a', 'a'));
      } else {
        h = `<span class="pts">${ptF('A', q.A)} ${ptF('B', q.B)} ${ptF('C', q.C)}</span>`
          + ligneQ(vec('AB'), '=', cvIn('ab', 'AB'), '&nbsp;', vec('AC'), '=', cvIn('ac', 'AC'))
          + ligneQ('<span class="petit">Alignés ?</span>', ouiNon('c', 'Alignés ?'));
      }
      ctx.q.innerHTML = h;
      activerChoix(ctx.q, v => { const k = ctx.q.querySelector('.k-ligne'); if (k) k.hidden = v !== 'oui'; });
      ctx.tip.innerHTML = '';

    }
    // sansV : v n'est pas dessiné (il va apparaître en s'allongeant)
    function dessiner(vRep, sansV = false, reps = null) {

      R.devoile();

        const fauxV = reps ? [['AB', reps.AB], ['AC', reps.AC]].filter(([, w]) => w && !vnul(w)) : [];

    const reveler = () => { if (!q.vu) { q.vu = true; dessiner(); } };

    return {
      debug: () => ({ q, R, D }),
      // l'élève modifie sa réponse : son vecteur faux (en rouge) disparaît de la figure
      edited() { if (q && ((q.type === 'a' && !q.trouve) || (q.type === 'aligne' && q.vu))) dessiner(); },
      next() {

        if (lv === 0) return explorer();

      },
      check() {
        if (q.type === 'test') {
          const p1 = fmul(q.u[0], q.v[1]), p2 = fmul(q.v[0], q.u[1]);

          const ch = choixDe(ctx.q, 'c');
          if (c.vides.length || !ch) return { empty: true, msg: 'Complète les deux produits et choisis Oui ou Non' + (ch === 'oui' ? ', puis k.' : '.') };
          const bonCh = (ch === 'oui') === !!q.k; marquerChoix(ctx.q, 'c', bonCh);
          reveler();

          if (c.faux.includes('p1')) return { msg: `Le produit ${XU}·${YV} est faux (l’autre est juste). Recalcule ${prod(q.u[0], q.v[1])}.` };
          if (c.faux.includes('p2')) return { msg: `Le produit ${XV}·${YU} est faux (l’autre est juste). Recalcule ${prod(q.v[0], q.u[1])}.` };
          if (!bonCh) return { msg: feq(p1, p2) ? 'Les deux produits sont <b>égaux</b> : les vecteurs sont donc colinéaires.' : 'Les deux produits sont <b>différents</b> : les vecteurs ne sont pas colinéaires, même s’ils en ont l’air !' };
          if (c.faux.includes('k')) return { msg: `${vec('v')} = k${vec('u')} : chaque composante de ${vec('v')} est k fois celle de ${vec('u')}, donc k = ${q.u[0].n ? frS(XV, XU) : frS(YV, YU)}.` };
          // bonne réponse : une copie de u vient se poser sur v (colinéaires) ou montre l'écart de direction

          return { ok: true, msg: q.k ? `Colinéaires : ${vec('v')} = ${coefHTML(q.k) || ''}${vec('u')}. Sur la figure, ${vec('v')} est parallèle à ${vec('u')}.`
            : `Pas colinéaires : ${fh(p1)} ≠ ${fh(p2)}. Sur la figure, ${vec('v')} sort de la direction de ${vec('u')}${degres(q.u, q.v) < 12 || degres(q.u, q.v) > 168 ? ' — de très peu : à l’œil, on aurait pu se tromper !' : '.'}` };
        }
        if (q.type === 'a') {
          const c = corriger(ctx.q, { a: q.a });
          if (c.vides.length) return { empty: true, msg: 'Écris la valeur de a.' };
          if (!c.faux.length) { q.trouve = true; dessiner(null, true); play(poserV); return { ok: true, msg: `<i>a</i> = ${fh(q.a)} : ${vec('u')} = ${cvF(q.u)} et ${vec('v')} = ${cvF(q.v)} sont parallèles.` }; }
          const ar = lire(ctx.q, 'a');
          if (ar) { const e = q.e[1].map(x => evalA(x, ar)); if (!vnul(e)) dessiner(e); }
          return { msg: `Avec cette valeur, les vecteurs ne sont pas colinéaires (ton vecteur en rouge). Écris ${XU}·${YV} = ${XV}·${YU} en remplaçant par les nombres.` };
        }

        if (c.vides.length || !ch) return { empty: true, msg: 'Complète les composantes et choisis Oui ou Non.' };
        const bonCh = (ch === 'oui') === q.colin; marquerChoix(ctx.q, 'c', bonCh);
        reveler();
        if (c.faux.length) {
          // les vecteurs faux sont dessinés en rouge depuis A : on voit qu'ils n'arrivent pas en B (ou en C)
          const fx = k => c.faux.includes(k + 'x') || c.faux.includes(k + 'y');
          dessiner(null, false, { AB: fx('ab') ? lireV(ctx.q, 'ab') : null, AC: fx('ac') ? lireV(ctx.q, 'ac') : null });
          const quoi = fx('ab') && fx('ac') ? `${vec('AB')} et ${vec('AC')}` : fx('ab') ? vec('AB') : vec('AC');
          return { msg: `Vérifie les composantes de ${quoi} : extrémité − origine. <span class="sub">Ta réponse est dessinée en rouge depuis A.</span>` };
        }
        if (!bonCh) return { msg: `Fais le test des produits avec ${vec('AB')} et ${vec('AC')} : ${prod(q.AB[0], q.AC[1])} et ${prod(q.AC[0], q.AB[1])}.` };
        // bonne réponse : AB puis AC se tracent depuis A
        play(async () => {
          await grow(R.fleche(L.main, q.A, q.A, { color: COL_U }), R.px(q.A), R.px(q.B), 700);
          await grow(R.fleche(L.main, q.A, q.A, { color: COL_V, w: 2.2 }), R.px(q.A), R.px(q.C), 900);
        });
        return { ok: true, msg: q.colin ? 'A, B et C sont alignés : C est sur la droite AB.' : 'Pas alignés : C n’est pas sur la droite AB. Sur la figure, l’écart est minuscule : seul le calcul permet d’en être sûr.' };
      },
      hint() {
        if (q.type === 'test') return indiceProduits([[q.u[0], q.v[1]], [q.v[0], q.u[1]]],
          [`Calcule les deux produits en croix : ${XU}·${YV} = ${prod(q.u[0], q.v[1])} et ${XV}·${YU} = ${prod(q.v[0], q.u[1])}.`,
           `S’ils sont égaux, les vecteurs sont colinéaires ; sinon, ils ne le sont pas.`,
           `S’ils sont colinéaires, k est le nombre par lequel on multiplie <b>chaque</b> composante de ${vec('u')} pour obtenir ${vec('v')}.`]);
        if (q.type === 'a') {
          const { g, d } = equationA(q.e), dev = q.e[1].some(x => estA(x) && !aSeul(x));
          return `<p class="step">• Remplace dans ${XU}·${YV} = ${XV}·${YU} : ${fois(q.e[0][0], q.e[1][1])} = ${fois(q.e[1][0], q.e[0][1])}.</p>`
            + (dev ? '<p class="step">• Distribue le nombre devant chaque parenthèse.</p>' : '')
            + (g.p.n && d.p.n ? '<p class="step">• Il y a des <i>a</i> des deux côtés : regroupe-les d’un même côté.</p>' : '')
            + '<p class="step">• Puis résous l’équation.</p>';
        }
        return `<p class="step">• ${vec('AB')} = ${cvS('x<sub>B</sub> − x<sub>A</sub>', 'y<sub>B</sub> − y<sub>A</sub>')}, de même pour ${vec('AC')}.</p><p class="step">• Puis teste si ${vec('AB')} et ${vec('AC')} sont colinéaires.</p>`;
      },
      solve() {
        const steps = [];
        const reset = () => { if (q.type !== 'a') q.vu = false; dessiner(); clear(L.main, L.aide); return {}; };
        if (q.type === 'test') {
          const p1 = fmul(q.u[0], q.v[1]), p2 = fmul(q.v[0], q.u[1]);
          steps.push({ say: `On multiplie <b>en croix</b> : la première composante de ${vec('u')} par la deuxième de ${vec('v')}.` + schemaProduits(q.u, q.v, 'croix', { etape: 1, calc: true }), write: `${XU}·${YV} = ${prod(q.u[0], q.v[1])} = ${fh(p1)}`, run: async () => { remplir(ctx.q, 'p1', p1); await wait(300); } });
          steps.push({ say: `Puis l’autre diagonale : la première de ${vec('v')} par la deuxième de ${vec('u')}.` + schemaProduits(q.u, q.v, 'croix', { etape: 2, calc: true }), write: `${XV}·${YU} = ${prod(q.v[0], q.u[1])} = ${fh(p2)}`, run: async () => { remplir(ctx.q, 'p2', p2); await wait(300); } });
          steps.push({
            say: q.k ? `Les produits sont égaux : ${vec('u')} et ${vec('v')} sont colinéaires.` : `Les produits sont différents : ${vec('u')} et ${vec('v')} ne sont pas colinéaires.`,
            write: q.k ? `${fh(p1)} = ${fh(p2)} : colinéaires` : `${fh(p1)} ≠ ${fh(p2)} : pas colinéaires`,
            run: async () => {
              choisir(ctx.q, 'c', q.k ? 'oui' : 'non'); const kl = ctx.q.querySelector('.k-ligne'); if (kl) kl.hidden = !q.k;
              q.vu = true; dessiner(null, true);
              await poserV();
            }
          });
          // une copie de u (u reste à sa place) glisse jusqu'à l'origine de v
          if (q.k) steps.push({
            say: `${vec('v')} = k${vec('u')} : une <b>copie</b> de ${vec('u')} glisse jusqu’à l’origine de ${vec('v')}${q.k.n < 0 ? ', se retourne' : ''} et ${Math.abs(num(q.k)) > 1 ? 's’allonge' : 'se raccourcit'} : elle se pose exactement sur ${vec('v')}. Les deux vecteurs sont parallèles.`,
            // k = x_v / x_u, ou y_v / y_u quand x_u = 0 (jamais de division par 0)
            write: q.u[0].n ? `k = ${frS(XV, XU)} = ${frS(fh(q.v[0]), fh(q.u[0]))} = ${fh(q.k)} &nbsp; ${vec('v')} = ${coefHTML(q.k) || ''}${vec('u')}`
              : `k = ${frS(YV, YU)} = ${frS(fh(q.v[1]), fh(q.u[1]))} = ${fh(q.k)} &nbsp; ${vec('v')} = ${coefHTML(q.k) || ''}${vec('u')}`,
            run: async () => { await copieU(q.k); remplir(ctx.q, 'k', q.k); }
          });
          else steps.push({
            say: `Une <b>copie</b> de ${vec('u')}, glissée jusqu’à l’origine de ${vec('v')} : elle ne suit pas la direction de ${vec('v')}, même si l’écart est faible.`,
            write: null,
            run: () => copieU(null)
          });
        } else if (q.type === 'a') {
          const [u, v] = q.e, { g, d, c, n } = equationA(q.e);
          const dev = v.some(x => estA(x) && !aSeul(x));       // des parenthèses à distribuer
          const finale = async () => { remplir(ctx.q, 'a', q.a); dessiner(null, true); await poserV(); };
          steps.push({ say: 'Colinéaires : les produits en croix sont égaux.', write: `${XU}·${YV} = ${XV}·${YU}`, run: () => wait(400) });
          steps.push({ say: 'On remplace par les composantes.', write: `${fois(u[0], v[1])} = ${fois(v[0], u[1])}`, run: () => wait(400) });
          steps.push({ say: dev ? 'On distribue (on multiplie chaque terme de la parenthèse).' : 'On calcule le produit connu.',
            write: `${affHTML(g)} = ${affHTML(d)}`, run: () => wait(400) });
          // a d'un seul côté et seul de son côté : on garde ce côté ; sinon on regroupe les a à gauche
          const regrouper = !!(g.p.n && d.p.n) || !!(g.p.n && g.q.n) || !!(d.p.n && d.q.n);
          const gauche = regrouper || !!g.p.n, cc = regrouper ? c : g.p.n ? g.p : d.p, nn = regrouper ? n : g.p.n ? d.q : g.q;
          if (regrouper) {
            const tg = [{ k: g.p, a: 1 }, { k: fneg(d.p), a: 1 }].filter(x => x.k.n), td = [{ k: d.q }, { k: fneg(g.q) }].filter(x => x.k.n);
            steps.push({ say: 'On regroupe les <i>a</i> à gauche et les nombres à droite : en changeant de côté, un terme change de signe.',
              write: `${somme(tg)} = ${somme(td)}`, run: () => wait(400) });
            if (tg.length > 1 || td.length > 1) steps.push({ say: 'On réduit chaque membre.', write: `${coefA(cc)} = ${fh(nn)}`, run: () => wait(400) });
          }
          etapeDiviser(steps, cc, nn, q.a, gauche, finale);
        } else {
          const { A, B, C, AB, AC } = q, p1 = fmul(AB[0], AC[1]), p2 = fmul(AC[0], AB[1]);
          steps.push({ say: `Composantes de ${vec('AB')} : extrémité − origine.`, write: `${vec('AB')} = ${cvS(`${fh(B[0])} − ${fp(A[0])}`, `${fh(B[1])} − ${fp(A[1])}`)} = ${cvF(AB)}`,
            run: async () => { remplir(ctx.q, 'abx', AB[0]); remplir(ctx.q, 'aby', AB[1]); await wait(300); } });
          steps.push({ say: `Composantes de ${vec('AC')}.`, write: `${vec('AC')} = ${cvS(`${fh(C[0])} − ${fp(A[0])}`, `${fh(C[1])} − ${fp(A[1])}`)} = ${cvF(AC)}`,
            run: async () => { remplir(ctx.q, 'acx', AC[0]); remplir(ctx.q, 'acy', AC[1]); await wait(300); } });
          steps.push({ say: `Test des produits en croix pour ${vec('AB')} et ${vec('AC')}.` + schemaProduits(AB, AC, 'croix', { noms: ['AB', 'AC'], calc: true }), write: `${prod(AB[0], AC[1])} = ${fh(p1)} &nbsp; ${prod(AC[0], AB[1])} = ${fh(p2)}`, run: () => wait(400) });
          steps.push({
            say: q.colin ? `Égaux : ${vec('AB')} et ${vec('AC')} sont colinéaires, donc A, B et C sont alignés.` : `Différents : A, B et C ne sont pas alignés (même si, sur la figure, l’écart se voit à peine).`,
            write: q.colin ? 'A, B, C alignés' : 'A, B, C pas alignés',
            run: async () => {
              choisir(ctx.q, 'c', q.colin ? 'oui' : 'non');
              q.vu = true; dessiner();
              await grow(R.fleche(L.main, A, A, { color: COL_U }), R.px(A), R.px(B), 700);
              await grow(R.fleche(L.main, A, A, { color: COL_V, w: 2.2 }), R.px(A), R.px(C), 900);
            } });
        }
        return { reset, steps };
      }
    };
  }
});

/* =====================================================================
   Outil 2, onglet 4 : vecteurs orthogonaux (p. 14-16)
   critère xu·xv + yu·yv = 0 ; construire un vecteur orthogonal ; trouver a
   ===================================================================== */
// orthogonaux : xu·xv + yu·yv = 0, ramenée à c·a = n
function equationO(e) {
  const g = amul(e[0][0], e[1][0]), d = amul(e[0][1], e[1][1]);
  return { g, d, c: fadd(g.p, d.p), n: fneg(fadd(g.q, d.q)) };
}

register({
  id: 'c4', title: 'Vecteurs orthogonaux', short: 'Orthogonaux',
  accent: '#3B5C76', bg: '#EEF1F4',
  explorer: 'fais tourner v',
  levels: [['Le test', 'somme des produits'], ['Construire', 'un vecteur orthogonal'], ['Trouver a', 'équation à résoudre']],
  newLabel: () => null,
  nextLabel: lv => lv === 0 ? '↻ Nouveaux défis' : null,
  consigne: lv => [
    `Fais glisser la pointe de ${vec('v')}. Observe les produits ${XU}·${XV} et ${YU}·${YV} et leur somme, puis relève les défis.`,
    `Calcule les deux produits, puis dis si les vecteurs sont orthogonaux.`
      + `<span class="warn">Orthogonaux ⟺ ${XU}·${XV} + ${YU}·${YV} = 0. La figure n’apparaît qu’après ta réponse.</span>`,
    `Donne les composantes d’un vecteur ${vec('v')} <b>non nul</b> orthogonal à ${vec('u')}.`
      + `<span class="warn">Il y a beaucoup de bonnes réponses : toutes sont acceptées.</span>`,
    `Trouve le nombre <i>a</i> pour que ${vec('u')} et ${vec('v')} soient orthogonaux.`
      + `<span class="warn">Écris ${XU}·${XV} + ${YU}·${YV} = 0 et résous l’équation. Fractions avec / (ex. <b>5/2</b>).</span>`
  ][lv],

  create(ctx) {
    const lv = ctx.level, R = makeRepere(ctx.svg);
    const L = layers(ctx.svg, ['aide', 'main', 'pts', 'top', 'poi']);
    let q = null, D = null, defis;
    const O = V(0, 0);

    // u et v depuis la même origine, avec l'angle droit (ou l'angle en degrés)
    // (vRep : v est la réponse fausse de l'élève, en rouge, avec « ta réponse »)
    function paire(S, u, v, colV = COL_V, angle = true, vRep = false) {
      R.fleche(L.main, S, vadd(S, u), { color: COL_U });
      const avecV = v && !vnul(v);
      if (avecV) R.fleche(L.main, S, vadd(S, v), { color: colV });
      if (avecV && angle) {
        if (!scal(u, v).n) R.angleDroit(L.aide, S, u, v);
        else {
          const P = R.px(S), a1 = Math.atan2(num(u[1]), num(u[0])), a2 = Math.atan2(num(v[1]), num(v[0]));
          let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
          const r = 26, p = a => [P[0] + r * Math.cos(a), P[1] - r * Math.sin(a)];
          svgEl('path', { class: 'arc fade-in', d: `M${p(a1)}A${r},${r} 0 0 ${d > 0 ? 0 : 1} ${p(a2)}` }, L.aide);
          const m = p(a1 + d / 2), e = [m[0] + (m[0] - P[0]) * .9, m[1] + (m[1] - P[1]) * .9];
          svgText(L.aide, e[0], e[1] + 4, `≈ ${Math.round(degres(u, v))}°`, { class: 'deg fade-in', 'text-anchor': 'middle' });
        }
      }
      // les noms en dernier : ils évitent les flèches, l'arc et l'angle
      R.nom(L.main, S, vadd(S, u), 'u', COL_U);
      if (avecV) R.nom(L.main, S, vadd(S, v), 'v', colV);
      if (avecV && vRep) {
        const g = svgEl('g', { class: 'nom-vec' }, L.top);
        svgText(g, 0, 0, 'ta réponse', { class: 'lbl', 'dominant-baseline': 'middle', fill: 'var(--ko)' });
        R.placerNom(g, S, vadd(S, v), -1);
      }
    }
    // v apparaît en s'allongeant depuis l'origine commune, puis l'angle (droit ou en degrés) et les noms
    async function poserV(v) {
      const S = V(0, 0);
      clear(L.aide, L.main, L.pts, L.top, L.poi); R.devoile();
      R.ajuster([S, q.u, v, vscl(-1, q.u)], 1.2);
      R.fleche(L.main, S, q.u, { color: COL_U });
      await grow(R.fleche(L.main, S, S, { color: COL_V }), R.px(S), R.px(v), 900);
      clear(L.main, L.aide); paire(S, q.u, v);
    }

    /* ---------- mode Explorer ---------- */
    function explorer() {
      const u = vecPlein(4, 2.5);
      D = { u, v: V(3, 0), S: O };
      const ortho = () => !vnul(D.v) && !scal(D.u, D.v).n;
      let premier = null;
      defis = [
        { txt: `Trouve un vecteur ${vec('v')} orthogonal à ${vec('u')}.`, test: () => ortho() && (premier = Math.sign(num(det(D.u, D.v)))) },
        { txt: `Trouve un vecteur orthogonal à ${vec('u')} qui pointe <b>de l’autre côté</b>.`, test: () => premier && ortho() && Math.sign(num(det(D.u, D.v))) === -premier },
        { txt: `Trouve un vecteur orthogonal à ${vec('u')} et de <b>même longueur</b>. Compare ses composantes avec celles de ${vec('u')}.`, test: () => ortho() && feq(scal(D.v, D.v), scal(D.u, D.u)) }
      ];
      ctx.q.innerHTML = `<div class="explo"><div class="live" id="live"></div>${defisHTML(defis)}</div>`;
      ctx.tip.innerHTML = `Fais glisser la pointe de ${vec('v')} (ou clique sur un nœud).`;
      maj();
    }
    function maj() {
      const { u, v, S } = D, p1 = fmul(u[0], v[0]), p2 = fmul(u[1], v[1]), s = fadd(p1, p2);
      document.getElementById('live').innerHTML =
        // produits en ligne, puis leur somme : chaque trait relie les deux nombres multipliés
        `<div class="sch-live">${schemaProduits(u, v, 'ligne', { calc: true })}</div>`
        + `<div>Somme : ${fh(p1)} + ${fp(p2)} = <b>${fh(s)}</b> → ${vnul(v) ? 'vecteur nul' : s.n ? '<span class="non">pas orthogonaux</span>' : '<span class="oui">orthogonaux</span>'}</div>`;
      clear(L.aide, L.main, L.pts, L.poi);
      paire(S, u, v, !vnul(v) && !s.n ? COL_W : COL_V);
      anneau(R, L.poi, vadd(S, v), COL_V);
      majDefis(ctx.q, defis);
    }
    poignees(R, {
      actif: () => lv === 0,
      liste: () => [{ m: vadd(D.S, D.v), bouger: m => { D.v = vsub(m, D.S); maj(); } }],
      clic: m => { D.v = vsub(V(...m), D.S); maj(); }
    });

    /* ---------- questions ---------- */
    function genere() {
      if (lv === 1) {
        const frac = Math.random() < PART_FRACTIONS_N1;      // fractions dans l'énoncé (environ 30 %)
        for (;;) {
          const u = frac && Math.random() < .6 ? vecFrac() : vecAlea(5), ortho = Math.random() < .5;
          const c = frac ? pick(fint(u[0]) && fint(u[1]) ? [F(1, 2), F(-1, 2), F(3, 2), F(1, 3), F(-2, 3)] : [F(1), F(2), F(-1), F(-2), F(1, 2)]) : pick([1, 2, -1, -2, 1, 1]);
          let v = vscl(c, V(fneg(u[1]), u[0]));
          if (frac && (!lisible(u) || !lisible(v) || !aDesFractions(u, v))) continue;
          if (!ortho) v = vadd(v, Math.random() < .5 ? V(pick([-1, 1]), 0) : V(0, pick([-1, 1])));
          if (vnul(v) || (!ortho && !scal(u, v).n) || Math.abs(num(v[0])) > 9 || Math.abs(num(v[1])) > 9) continue;
          return { type: 'test', u, v, ortho, vu: false };
        }
      }
      if (lv === 2) {
        const u = Math.random() < .25 ? V(F(nz(-5, 5), 2), nz(-4, 4)) : vecAlea(5);
        return vnul(u) ? genere() : { type: 'construire', u };
      }
      return genereA(equationO);
    }
    function poser() {
      let h;
      if (q.type === 'test') h = `<span class="pts">${vec('u')} = ${cvF(q.u)} &nbsp; ${vec('v')} = ${cvF(q.v)}</span>`
        + ligneQ(`${XU}·${XV} =`, champ('p1', 'produit x u fois x v'), `&nbsp; ${YU}·${YV} =`, champ('p2', 'produit y u fois y v'))
        + ligneQ('<span class="petit">Orthogonaux ?</span>', ouiNon('c', 'Orthogonaux ?'));
      else if (q.type === 'construire') h = `<span class="pts">${vec('u')} = ${cvF(q.u)}</span>` + ligneQ(vec('v'), '=', cvIn('r', 'v'));
      else h = `<span class="pts">${vec('u')} = ${cvA(q.e[0])} &nbsp; ${vec('v')} = ${cvA(q.e[1])}</span>` + ligneQ('<i>a</i> =', champ('a', 'a'));
      ctx.q.innerHTML = h;
      activerChoix(ctx.q);
      ctx.tip.innerHTML = q.type === 'test' ? '' : `Ton vecteur ${vec('v')} sera dessiné à partir de la même origine que ${vec('u')}.`;
      dessiner();
    }
    // origine commune : on centre la figure sur u et v
    function dessiner(vRep, montrerV) {
      clear(L.aide, L.main, L.pts, L.top, L.poi);
      if (q.type === 'test' && !q.vu) { R.base(); R.voile('Fais d’abord le test par calcul : la figure apparaîtra quand tu vérifies.'); return; }
      R.devoile();
      const v = vRep || (montrerV || q.type === 'test' ? q.v : null);
      const S = V(0, 0);
      R.ajuster([S, q.u, ...(v ? [v] : []), vscl(-1, q.u)], 1.2);
      paire(S, q.u, v, vRep ? 'var(--ko)' : COL_V, true, !!vRep);
      if (!v) R.droite(L.aide, S, V(fneg(q.u[1]), q.u[0]), 'guide faible');
    }

    return {
      debug: () => ({ q, R, D }),
      // l'élève modifie sa réponse : son vecteur faux (en rouge) disparaît de la figure
      edited() { if (q && q.type !== 'test') dessiner(); },
      next() {
        cancelAnim(); R.base();
        if (lv === 0) return explorer();
        q = genere(); poser();
      },
      check() {
        if (q.type === 'test') {
          const p1 = fmul(q.u[0], q.v[0]), p2 = fmul(q.u[1], q.v[1]);
          const c = corriger(ctx.q, { p1, p2 }), ch = choixDe(ctx.q, 'c');
          if (c.vides.length || !ch) return { empty: true, msg: 'Complète les deux produits et choisis Oui ou Non.' };
          const bonCh = (ch === 'oui') === q.ortho; marquerChoix(ctx.q, 'c', bonCh);
          q.vu = true; dessiner();
          if (c.faux.includes('p1') && c.faux.includes('p2')) return { msg: `Les deux produits sont faux. Recalcule : ${XU}·${XV} = ${prod(q.u[0], q.v[0])} et ${YU}·${YV} = ${prod(q.u[1], q.v[1])}.` };
          if (c.faux.includes('p1')) return { msg: `Le produit ${XU}·${XV} est faux (l’autre est juste). Recalcule ${prod(q.u[0], q.v[0])}.` };
          if (c.faux.includes('p2')) return { msg: `Le produit ${YU}·${YV} est faux (l’autre est juste). Recalcule ${prod(q.u[1], q.v[1])}.` };
          if (!bonCh) return { msg: `${fh(p1)} + ${fp(p2)} = ${fh(fadd(p1, p2))} : ${q.ortho ? 'la somme est nulle, ils <b>sont</b> orthogonaux.' : 'la somme n’est pas nulle, ils ne sont <b>pas</b> orthogonaux (regarde l’angle sur la figure).'}` };
          play(() => poserV(q.v));                              // bonne réponse : v se trace, puis l'angle
          return { ok: true, msg: q.ortho ? `${fh(p1)} + ${fp(p2)} = 0 : orthogonaux, l’angle est droit.` : `${fh(p1)} + ${fp(p2)} = ${fh(fadd(p1, p2))} ≠ 0 : pas orthogonaux (angle ≈ ${Math.round(degres(q.u, q.v))}°).` };
        }
        if (q.type === 'construire') {
          if (vide(ctx.q, 'rx') || vide(ctx.q, 'ry')) return { empty: true, msg: 'Complète les deux composantes.' };
          const v = lireV(ctx.q, 'r');
          const ok = v && !vnul(v) && !scal(q.u, v).n;
          ['rx', 'ry'].forEach(k => { const i = champDe(ctx.q, k); i.classList.toggle('good', !!ok); i.classList.toggle('bad', !ok); });
          if (!v) return { msg: 'Écris des nombres (fractions avec /).' };
          if (vnul(v)) return { msg: 'Le vecteur nul ne compte pas : cherche un vecteur non nul.' };
          if (ok) { q.v = v; play(() => poserV(v)); } else dessiner(v);
          if (ok) return { ok: true, msg: `${prod(q.u[0], v[0])} + ${prod(q.u[1], v[1])} = 0 : orthogonaux. <span class="sub">Il y en a une infinité : par exemple ${cvF(V(fneg(q.u[1]), q.u[0]))} et tous ses multiples.</span>` };
          return { msg: `${prod(q.u[0], v[0])} + ${prod(q.u[1], v[1])} = ${fh(scal(q.u, v))} ≠ 0. Cherche ${XV} et ${YV} pour que les deux produits soient <b>opposés</b>.` };
        }
        const c = corriger(ctx.q, { a: q.a });
        if (c.vides.length) return { empty: true, msg: 'Écris la valeur de a.' };
        if (!c.faux.length) { play(() => poserV(q.v)); return { ok: true, msg: `<i>a</i> = ${fh(q.a)} : ${vec('v')} = ${cvF(q.v)} est orthogonal à ${vec('u')}.` }; }
        const ar = lire(ctx.q, 'a');
        if (ar) { const e = q.e[1].map(x => evalA(x, ar)); if (!vnul(e)) dessiner(e); }
        return { msg: `Avec cette valeur, l’angle n’est pas droit (ton vecteur en rouge). Remplace dans ${XU}·${XV} + ${YU}·${YV} = 0.` };
      },
      hint() {
        if (q.type === 'test') return indiceProduits([[q.u[0], q.v[0]], [q.u[1], q.v[1]]],
          [`Multiplie les premières composantes, puis les deuxièmes : ${XU}·${XV} = ${prod(q.u[0], q.v[0])} et ${YU}·${YV} = ${prod(q.u[1], q.v[1])}.`,
           `Additionne les deux produits : si la somme vaut 0, les vecteurs sont orthogonaux ; sinon, ils ne le sont pas.`]);
        if (q.type === 'construire') return `<p class="step">• Il faut ${fp(q.u[0])}·${XV} + ${fp(q.u[1])}·${YV} = 0.</p><p class="step">• Essaie d’échanger les composantes de ${vec('u')} et de changer un des deux signes.</p>`;
        return `<p class="step">• Remplace : ${fois(q.e[0][0], q.e[1][0])} + ${fois(q.e[0][1], q.e[1][1])} = 0.</p>`
          + (q.e[1].some(x => estA(x) && !aSeul(x)) ? '<p class="step">• Distribue le nombre devant chaque parenthèse.</p>' : '')
          + (q.e[1].every(estA) ? '<p class="step">• Il y a deux termes en <i>a</i> : réduis-les.</p>' : '')
          + '<p class="step">• Puis résous l’équation.</p>';
      },
      solve() {
        const steps = [];
        const reset = () => { if (q.type === 'test') q.vu = false; dessiner(); return {}; };
        if (q.type === 'test') {
          const p1 = fmul(q.u[0], q.v[0]), p2 = fmul(q.u[1], q.v[1]), s = fadd(p1, p2);
          steps.push({ say: `On multiplie <b>en ligne</b> : les premières composantes ensemble.` + schemaProduits(q.u, q.v, 'ligne', { etape: 1, calc: true }), write: `${XU}·${XV} = ${prod(q.u[0], q.v[0])} = ${fh(p1)}`, run: async () => { remplir(ctx.q, 'p1', p1); await wait(300); } });
          steps.push({ say: `Puis les deuxièmes composantes ensemble ; ensuite, on additionnera les deux produits.` + schemaProduits(q.u, q.v, 'ligne', { etape: 2, calc: true, concl: `Somme : ${fh(p1)} + ${fp(p2)} = <b>${fh(s)}</b>` }), write: `${YU}·${YV} = ${prod(q.u[1], q.v[1])} = ${fh(p2)}`, run: async () => { remplir(ctx.q, 'p2', p2); await wait(300); } });
          steps.push({
            say: s.n ? 'La somme n’est pas nulle : les vecteurs ne sont pas orthogonaux.' : 'La somme est nulle (les produits sont opposés) : les vecteurs sont orthogonaux.',
            write: `${fh(p1)} + ${fp(p2)} = ${fh(s)} : ${s.n ? 'pas orthogonaux' : 'orthogonaux'}`,
            run: async () => {
              choisir(ctx.q, 'c', s.n ? 'non' : 'oui');
              q.vu = true; dessiner(); clear(L.main, L.aide);
              const S = V(0, 0);
              R.fleche(L.main, S, q.u, { color: COL_U }); R.nom(L.main, S, q.u, 'u', COL_U);
              await grow(R.fleche(L.main, S, S, { color: COL_V }), R.px(S), R.px(q.v), 900);
              clear(L.main); paire(S, q.u, q.v);
            } });
        } else if (q.type === 'construire') {
          const w = V(fneg(q.u[1]), q.u[0]), S = V(0, 0);
          steps.push({ say: `On fait tourner ${vec('u')} d’un quart de tour.`, write: null,
            run: async () => {
              clear(L.main, L.aide); R.ajuster([S, q.u, w, vscl(-1, q.u)], 1.2);
              R.fleche(L.main, S, q.u, { color: COL_U }); R.nom(L.main, S, q.u, 'u', COL_U);
              const a = R.fleche(L.top, S, q.u, { color: COL_V, w: 2.6 }), [x, y] = vnum(q.u);
              await wait(300);
              await tween(1300, t => { const th = t * Math.PI / 2; a.set(R.px(S), R.px([x * Math.cos(th) - y * Math.sin(th), x * Math.sin(th) + y * Math.cos(th)])); });
            } });
          steps.push({ say: 'Après un quart de tour, les composantes sont échangées et la nouvelle première change de signe.',
            write: `${vec('u')} = ${cvF(q.u)} &nbsp;→&nbsp; ${vec('v')} = ${cvS(`${MINUS}${fp(q.u[1])}`, fh(q.u[0]))} = ${cvF(w)}`,
            run: async () => { clear(L.top); paire(S, q.u, w); remplir(ctx.q, 'rx', w[0]); remplir(ctx.q, 'ry', w[1]); await wait(300); } });
          steps.push({ say: 'On vérifie avec le test : la somme des produits est nulle.', write: `${prod(q.u[0], w[0])} + ${prod(q.u[1], w[1])} = ${fh(fmul(q.u[0], w[0]))} + ${fp(fmul(q.u[1], w[1]))} = 0`, run: () => wait(400) });
        } else {
          const [u, v] = q.e;
          steps.push({ say: 'Orthogonaux : la somme des produits est nulle.', write: `${XU}·${XV} + ${YU}·${YV} = 0`, run: () => wait(400) });
          steps.push({ say: 'On remplace par les composantes.', write: `${fois(u[0], v[0])} + ${fois(u[1], v[1])} = 0`, run: () => wait(400) });
          const { g, d, c, n } = equationO(q.e), dev = v.some(x => estA(x) && !aSeul(x));
          const finale = async () => {
            remplir(ctx.q, 'a', q.a);
            dessiner(null, true); clear(L.main, L.aide);
            const S = V(0, 0);
            R.fleche(L.main, S, q.u, { color: COL_U }); R.nom(L.main, S, q.u, 'u', COL_U);
            await grow(R.fleche(L.main, S, S, { color: COL_V }), R.px(S), R.px(q.v), 900);
            clear(L.main); paire(S, q.u, q.v);
          };
          const termes = [{ k: g.p, a: 1 }, { k: g.q }, { k: d.p, a: 1 }, { k: d.q }].filter(x => x.k.n);
          steps.push({ say: dev ? 'On distribue (on multiplie chaque terme de la parenthèse).' : 'On calcule le produit connu.',
            write: `${somme(termes)} = 0`, run: () => wait(400) });
          // plusieurs termes en a, ou plusieurs nombres : on réduit
          if (termes.filter(x => x.a).length > 1 || termes.filter(x => !x.a).length > 1)
            steps.push({ say: 'On réduit.', write: `${somme([{ k: c, a: 1 }, { k: fneg(n) }])} = 0`, run: () => wait(400) });
          steps.push({ say: 'On isole <i>a</i> : le nombre change de côté, et donc de signe.', write: `${coefA(c)} = ${fh(n)}`, run: () => wait(400) });
          etapeDiviser(steps, c, n, q.a, true, finale);
        }
        return { reset, steps };
      }
    };
  }
});

boot('comp4');

(function () {
  const doc = document.documentElement;
  if (!doc.requestFullscreen || !document.fullscreenEnabled) return;   // ex. dans un cadre qui l'interdit
  const entrer = () => doc.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  const sortir = () => document.exitFullscreen().catch(() => {});

  // icônes : quatre coins vers l'extérieur (entrer) ou vers l'intérieur (sortir)
  const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>';
  const ICONE_ENTRER = svg('M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5');
  const ICONE_SORTIR = svg('M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5');

  const bouton = document.createElement('button');
  bouton.type = 'button';
  bouton.className = 'pe-bouton';
  const barre = document.querySelector('.topbar-inner');
  if (!barre) bouton.classList.add('flottant');

  const maj = () => {
    const plein = !!document.fullscreenElement;
    bouton.innerHTML = plein ? ICONE_SORTIR : ICONE_ENTRER;
    bouton.title = plein ? 'Quitter le plein écran' : 'Plein écran';
    bouton.setAttribute('aria-label', bouton.title);
  };
  bouton.addEventListener('click', () => document.fullscreenElement ? sortir() : entrer());
  document.addEventListener('fullscreenchange', maj);
  maj();

  (barre || document.body).append(bouton);
})();
